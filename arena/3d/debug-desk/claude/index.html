<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>3 AM Debug Desk</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060c;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none;outline:none}
.glass{background:rgba(14,16,28,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#hint{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);padding:10px 18px;font-size:14px;line-height:1.45;text-align:center;transition:opacity 1.4s;pointer-events:none;max-width:88vw;z-index:5}
#hint.hide{opacity:0}
#bubble{position:fixed;left:0;top:0;max-width:min(270px,70vw);padding:11px 14px;font-size:14px;line-height:1.4;background:#fffdf2;color:#262016;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transition:opacity .25s;pointer-events:none;z-index:4;will-change:transform}
#bubble.show{opacity:1}
#bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-9px;width:18px;height:18px;background:#fffdf2;transform:translateX(-50%) rotate(45deg);border-radius:3px}
#bubble b{color:#b5650d}
#bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:6px;z-index:5}
#bar button{all:unset;cursor:pointer;padding:7px 12px;border-radius:10px;font-size:13px;white-space:nowrap}
#bar button:hover{background:rgba(255,255,255,.1)}
#score{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));padding:8px 12px;font-size:13px;z-index:5}
#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%) scale(.94);padding:12px 20px;font-size:15px;opacity:0;transition:opacity .45s,transform .45s;pointer-events:none;text-align:center;max-width:86vw;z-index:6}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:560px){#hint{top:auto;bottom:70px;font-size:13px}}
</style>
</head>
<body>
<div id="hint" class="glass">Drag to look around · scroll or pinch to zoom<br><span style="opacity:.85">It's 3 AM and the tests are red. <b>Tap the rubber duck</b> and explain your code to it.</span></div>
<div id="bubble"></div>
<div id="score" class="glass">🐛 Bugs fixed 0 / 4</div>
<div id="bar" class="glass"><button id="vDesk">🦆 Desk</button><button id="vScreen">🖥️ Screen</button><button id="vSound">🔊 Sound</button></div>
<div id="toast" class="glass"></div>
<script type="module">
import * as THREE from "/lib/three/three.module.js";
import { OrbitControls } from "/lib/three/OrbitControls.js";

const $ = id => document.getElementById(id);
const vesta = (fn, ...a) => { try { window.vesta?.[fn]?.(...a); } catch (e) {} };
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 314;
const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
let toastTimer = 0;

const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const MONO = '"SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace';

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

const scene = new THREE.Scene();
scene.background = new THREE.Color('#05060c');

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.02, 30);
const portrait = () => innerWidth < innerHeight;
const HOME = { pos: new THREE.Vector3(0.3, 0.8, 1.6), tgt: new THREE.Vector3(-0.05, 0.3, -0.12) };
const SCREEN_VIEW = { pos: new THREE.Vector3(0, 0.6, 0.42), tgt: new THREE.Vector3(0, 0.57, -0.42) };
function homePos() { return portrait() ? HOME.pos.clone().sub(HOME.tgt).multiplyScalar(1.55).add(HOME.tgt) : HOME.pos.clone(); }
camera.position.copy(homePos());

controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;

controls.minAzimuthAngle = -1.25; controls.maxAzimuthAngle = 1.25;

// ---------- canvas helpers ----------
function canvasTex(w, h, draw, srgb = true) {

  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const woodTex = canvasTex(1024, 512, (g, w, h) => {
  g.fillStyle = '#4a2e1c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const y = rand() * h, amp = 2 + rand() * 6, fr = 0.002 + rand() * 0.006, ph = rand() * 6;
    g.strokeStyle = rand() < 0.5 ? `rgba(20,10,4,${0.12 + rand() * 0.2})` : `rgba(140,90,55,${0.08 + rand() * 0.14})`;
    g.lineWidth = 0.6 + rand() * 2.2; g.beginPath();
    for (let x = 0; x <= w; x += 16) { const yy = y + Math.sin(x * fr + ph) * amp + Math.sin(x * fr * 3.1 + ph) * amp * 0.3; x === 0 ? g.moveTo(x, yy) : g.lineTo(x, yy); }
    g.stroke();
  }
  for (let i = 0; i < 4; i++) { const x = rand() * w, y = rand() * h; const gr = g.createRadialGradient(x, y, 0, x, y, 26); gr.addColorStop(0, 'rgba(30,15,6,0.5)'); gr.addColorStop(1, 'rgba(30,15,6,0)'); g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, 40, 14, 0, 0, 7); g.fill(); }
  // a coffee ring, of course

const windowTex = canvasTex(512, 420, (g, w, h) => {

  const mg = g.createRadialGradient(380, 90, 0, 380, 90, 90); mg.addColorStop(0, 'rgba(210,220,255,0.55)'); mg.addColorStop(1, 'rgba(210,220,255,0)'); g.fillStyle = mg; g.fillRect(250, 0, 262, 200);
  g.fillStyle = '#f2f2ff'; g.beginPath(); g.arc(380, 90, 30, 0, 7); g.fill();
  g.fillStyle = 'rgba(180,185,215,0.6)'; [[370, 82, 6], [392, 98, 5], [376, 104, 3.5]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
  for (let layer = 0; layer < 2; layer++) {

});

}
const posterTex = canvasTex(300, 420, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#1a1f4a'); gr.addColorStop(1, '#3a1a4a'); g.fillStyle = gr; g.fillRect(0, 0, w, h);

  g.save(); g.translate(w / 2, 150); g.rotate(-0.5);
  g.fillStyle = '#e8ecff'; g.beginPath(); g.ellipse(0, 0, 26, 70, 0, 0, 7); g.fill();
  g.fillStyle = '#ff5a5a'; g.beginPath(); g.moveTo(-26, 30); g.lineTo(-46, 70); g.lineTo(-18, 56); g.fill(); g.beginPath(); g.moveTo(26, 30); g.lineTo(46, 70); g.lineTo(18, 56); g.fill();
  g.fillStyle = '#5ab0ff'; g.beginPath(); g.arc(0, -14, 12, 0, 7); g.fill();
  g.fillStyle = '#ff9a3a'; g.beginPath(); g.moveTo(-14, 66); g.lineTo(0, 110); g.lineTo(14, 66); g.fill();
  g.restore();
  g.fillStyle = 'rgba(255,255,255,0.5)'; g.font = `14px ${MONO}`; g.fillText('// on a friday, obviously', w / 2, 400);

// ---------- room ----------
const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.8 }, o));

const wallMat = std('#1c2132', { roughness: 0.95 });

winPane.position.set(WIN.x, WIN.y, -0.945); scene.add(winPane);
const frameMat = std('#2a2c38', { roughness: 0.6 });
[[WIN.w + 0.08, 0.05, 0, WIN.h / 2], [WIN.w + 0.08, 0.05, 0, -WIN.h / 2], [0.05, WIN.h, -WIN.w / 2, 0], [0.05, WIN.h, WIN.w / 2, 0], [0.03, WIN.h, 0, 0], [WIN.w, 0.03, 0, 0.05]].forEach(([w, h, x, y]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), frameMat); m.position.set(WIN.x + x, WIN.y + y, -0.93); scene.add(m);
});
const sill = new THREE.Mesh(new THREE.BoxGeometry(WIN.w + 0.2, 0.03, 0.12), frameMat); sill.position.set(WIN.x, WIN.y - WIN.h / 2 - 0.03, -0.9); scene.add(sill);
const poster = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.63), std('#ffffff', { map: posterTex, roughness: 0.7 }));
poster.position.set(1.3, 1.2, -0.945); poster.rotation.z = 0.03; scene.add(poster);

// ---------- desk ----------
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
const deskMat = std('#ffffff', { map: woodTex, roughness: 0.55 });
const desk = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.05, 1.3), deskMat); desk.position.y = -0.025; desk.receiveShadow = true; desk.castShadow = true; scene.add(desk);
const legMat = std('#1a1a1f', { metalness: 0.6, roughness: 0.4 });
[[-1.38, -0.58], [1.38, -0.58], [-1.38, 0.58], [1.38, 0.58]].forEach(([x, z]) => { const l = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.71, 0.05), legMat); l.position.set(x, -0.405, z); scene.add(l); });

// ---------- monitor ----------
const darkMetal = std('#15161b', { metalness: 0.5, roughness: 0.45 });
const monitor = new THREE.Group(); scene.add(monitor);
{
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.17, 0.018, 40), darkMetal); base.position.set(0, 0.009, -0.44);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.025), darkMetal); neck.position.set(0, 0.16, -0.46);
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(1.12, 0.66, 0.035), std('#0d0e12', { roughness: 0.35, metalness: 0.2 })); bezel.position.set(0, 0.58, -0.42);
  [base, neck, bezel].forEach(m => { m.castShadow = true; m.receiveShadow = true; monitor.add(m); });
}
const SW = 1024, SH = 580;
const scv = document.createElement('canvas'); scv.width = SW; scv.height = SH; const sx = scv.getContext('2d');
const screenTex = new THREE.CanvasTexture(scv); screenTex.colorSpace = THREE.SRGBColorSpace; screenTex.anisotropy = 8;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.06, 0.6), new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false }));
screen.position.set(0, 0.58, -0.4015); screen.userData.kind = 'screen'; scene.add(screen);
const screenGlow = new THREE.PointLight(0x7aa0ff, 0.55, 3, 2); screenGlow.position.set(0, 0.55, -0.22); scene.add(screenGlow);
// sticky notes
[[noteTex('#ffe66a', ['it works', 'on my', 'machine']), -0.5, 0.86, 0.12], [noteTex('#ff9ec4', ['TODO:', 'sleep']), 0.52, 0.32, -0.15], [noteTex('#9ef0c0', ['git push', '--force?', 'NO.']), 0.5, 0.84, -0.08]].forEach(([tex, x, y, r]) => {
  const n = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.1), std('#ffffff', { map: tex, roughness: 0.9, side: THREE.DoubleSide }));
  n.position.set(x, y, -0.401); n.rotation.z = r; scene.add(n);
});

// ---------- keyboard ----------
const ROWS = ['`1234567890-=', 'QWERTYUIOP[]', "ASDFGHJKL;'", 'ZXCVBNM,./'];
const KB = { x: 0, z: 0.14 };
const kbBase = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.022, 0.3), std('#1b1c22', { metalness: 0.4, roughness: 0.5 }));
kbBase.position.set(KB.x, 0.011, KB.z); kbBase.castShadow = true; kbBase.receiveShadow = true; scene.add(kbBase);
const kbGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.27), new THREE.MeshBasicMaterial({ color: '#2a54ff' }));
kbGlow.rotation.x = -Math.PI / 2; kbGlow.position.set(KB.x, 0.0225, KB.z); scene.add(kbGlow);
const keyChars = [];
const keyBase = [];
ROWS.forEach((row, r) => { for (let i = 0; i < row.length; i++) { keyChars.push(row[i]); keyBase.push([KB.x - 0.36 + r * 0.018 + i * 0.058, KB.z - 0.105 + r * 0.058]); } });
const KEYN = keyChars.length;
const keys = new THREE.InstancedMesh(new THREE.BoxGeometry(0.05, 0.016, 0.05), std('#ffffff', { roughness: 0.6 }), KEYN + 1);
keyBase.push([KB.x, KB.z + 0.127]); keyChars.push(' ');

function setKey(i) { const [x, z] = keyBase[i]; kp.set(x, 0.03 - keyPress[i] * 0.008, z); ks.set(i === KEYN ? 6 : 1, 1, i === KEYN ? 0.9 : 1); kmat.compose(kp, kq, ks); keys.setMatrixAt(i, kmat); }
const keyCol = new THREE.Color();
for (let i = 0; i <= KEYN; i++) { setKey(i); keys.setColorAt(i, keyCol.set('WASD'.includes(keyChars[i]) && keyChars[i] !== ' ' ? '#3a3f55' : (i === 0 ? '#d06a2a' : '#25272f'))); }
keys.castShadow = true; keys.userData.kind = 'key'; scene.add(keys);
// mouse + pad
const pad = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.004, 0.27), std('#20243a', { roughness: 1 })); pad.position.set(0.62, 0.002, 0.16); pad.receiveShadow = true; scene.add(pad);

// ---------- mug ----------
const mug = new THREE.Group(); mug.position.set(0.92, 0, -0.06); scene.add(mug);

let coffee;
{

const steamTex = canvasTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });

// ---------- lamp ----------

// ---------- misc props ----------
{

  for (const h of hits) { let o = h.object; while (o && !o.userData.kind) o = o.parent; if (o && !o.visible) continue; if (o) return { o, h }; if (h.object === desk || h.object.parent === monitor || h.object === kbBase) return null; }
  return null;
}
let lastHover = 0;
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons || performance.now() - lastHover < 80) return; lastHover = performance.now();
  renderer.domElement.style.cursor = firstHit(e.clientX, e.clientY) ? 'pointer' : 'grab';
});
function pick(x, y) {
  const r = firstHit(x, y); if (!r) return;
  const { o, h } = r, k = o.userData.kind;
  if (k === 'duck') quack();
  else if (k === 'screen' && h.uv) {
    const py = (1 - h.uv.y) * SH;
    if (py < TY) { const line = Math.floor((py - CODE_TOP + 2) / LINE_H); if (line >= 0 && line < code.length && code[line].trim()) tapLine(line); }
  } else if (k === 'key' && h.instanceId !== undefined) pressKey(h.instanceId);
  else if (k === 'mug') sip();
  else if (k === 'lamp') toggleLamp();
  else if (k === 'bug') catchBug();
}
function pressKey(i) { keyPress[i] = 1; click(); }
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const ch = e.key.length === 1 ? e.key.toUpperCase() : null;
  if (!ch) return;
  const i = keyChars.indexOf(ch); if (i >= 0) { ensureAudio(); pressKey(i); }
});
function sip() {
  const u = mug.userData; if (u.sip >= 0) return;
  ensureAudio();
  if (u.sips >= 5) { u.sips = 0; coffee.visible = true; toast('☕ Refilled. Coffee level: restored.'); tone(300, 200, 0.4, 'sine', 0.04); return; }
  u.sip = 0; u.sips++; tone(220, 160, 0.3, 'sine', 0.04, 0.35);
  if (u.sips === 3) { vesta('milestone', 'caffeinated'); toast('☕ Caffeine level: dangerously productive'); }
  if (u.sips === 5) { setTimeout(() => { coffee.visible = false; toast('Out of coffee! Debugging speed −50%. Tap the mug to refill.'); }, 1300); }
}
let lampDone = false;
function toggleLamp() {
  lamp.userData.on = !lamp.userData.on; ensureAudio(); tone(2400, 2000, 0.05, 'square', 0.03);
  spot.intensity = lamp.userData.on ? 2.6 : 0; lampGlow.intensity = lamp.userData.on ? 0.12 : 0; bulbMat.emissiveIntensity = lamp.userData.on ? 3 : 0;
  if (!lamp.userData.on && !lampDone) { lampDone = true; vesta('milestone', 'lights-out'); toast('Just you, the monitor glow, and the duck. 🌙'); }
}
function catchBug() {
  if (B.state !== 0) return; B.state = 1; B.t = 0; ensureAudio(); tone(700, 1400, 0.2, 'triangle', 0.06);
  if (!B.found) { B.found = true; vesta('achievement', 'literal-bug', 'Found a Literal Bug'); toast('🐞 You found a literal bug. Your tests are still red though.'); }
  else toast('🐞 Caught it again!');
}

// camera presets
let fly = null;
function flyTo(pos, tgt) { fly = { t: 0, fromP: camera.position.clone(), fromT: controls.target.clone(), pos, tgt }; controls.enabled = false; }
$('vDesk').onclick = () => flyTo(homePos(), HOME.tgt.clone());
$('vScreen').onclick = () => flyTo(portrait() ? SCREEN_VIEW.pos.clone().setZ(0.95) : SCREEN_VIEW.pos.clone(), SCREEN_VIEW.tgt.clone());

// ---------- resize / visibility ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight);
});
setTimeout(() => $('hint').classList.add('hide'), 7000);
setTimeout(() => { if (state === 'intro') say("Hi, I'm <b>Quackers</b> 🦆 Your test is failing. Tap me and talk me through the code."); }, 1600);

// ---------- loop ----------
let last = performance.now(), T = 0, blinkAcc = 0;
const headW = new THREE.Vector3(), tv = new THREE.Vector3(), monCol = new THREE.Color(), baseMon = new THREE.Color(0x7aa0ff), redMon = new THREE.Color(0xff6a7a), greenMon = new THREE.Color(0x60ffa0);
function loop() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;

  // typing the fix
  if (state === 'fixing') {
    typingAcc += dt;
    while (typingAcc > 0.05 && typingQ.length) { typingAcc -= 0.05; code[PUZZLES[pz].bug] = typingQ.shift(); click(); screenDirty = true; }
    if (!typingQ.length && typingAcc > 0.5) { state = 'running'; tests = 'running'; runT = 0; screenDirty = true; }
  } else if (state === 'running') {
    const before = (runT * 4) | 0; runT += dt; if (((runT * 4) | 0) !== before) screenDirty = true;
    if (runT > 1.4) {
      state = 'passed'; tests = 'pass'; passFlash = 1; screenDirty = true; chime();
      if (!solvedSet.has(pz)) { solvedSet.add(pz); fixedCount = Math.min(4, fixedCount + 1); }
      scoreEl.textContent = `🐛 Bugs fixed ${fixedCount} / 4`;
      duckHead.getWorldPosition(headW); popConfetti(headW.add(tv.set(0, 0.05, 0))); duck.userData.jump = 0;
      vesta('milestone', 'fixed-' + PUZZLES[pz].file.replace('.js', ''));
      if (solvedSet.size === PUZZLES.length) {
        everything = true;
        vesta('achievement', 'duck-certified', 'Duck-Certified Debugger');
        say('🎉 All green, every file. That was all you, I just sat here. <b>Go to sleep!</b> 🌙 (Tap me for another lap.)');
        toast('🏆 Duck-Certified Debugger: all 4 bugs fixed');
      } else say('🎉 <b>Tests pass!</b> See? You knew the answer, you just had to say it out loud. Tap me for the next bug.');
    }
  }
  if (wrongT > 0) { wrongT -= dt; screenDirty = true; if (wrongT <= 0) wrongLine = -1; }
  if (passFlash > 0) { passFlash = Math.max(0, passFlash - dt * 0.8); screenDirty = true; }
  blinkAcc += dt; if (blinkAcc > 0.53) { blinkAcc = 0; blink = !blink; screenDirty = true; }
  if (screenDirty) { drawScreen(); screenDirty = false; }
  monCol.copy(baseMon).lerp(tests === 'pass' ? greenMon : redMon, tests === 'pass' ? 0.35 + passFlash * 0.5 : tests === 'fail' ? 0.15 + Math.sin(T * 2) * 0.05 : 0);
  screenGlow.color.copy(monCol);

  // keys
  for (let i = 0; i <= KEYN; i++) if (keyPress[i] > 0) { keyPress[i] = Math.max(0, keyPress[i] - dt * 7); setKey(i); keys.instanceMatrix.needsUpdate = true; }
  if (state === 'fixing' && typingQ.length && Math.random() < 0.5) { keyPress[(Math.random() * KEYN) | 0] = 1; }

  // duck
  const du = duck.userData;
  let jy = 0, sq = 1;
  if (du.jump >= 0) { du.jump += dt; const k = du.jump / 0.42; if (k >= 1) du.jump = -1; else { jy = Math.sin(k * Math.PI) * 0.045; sq = 1 + Math.sin(k * Math.PI * 2) * 0.08; } }
  duckBody.position.y = jy; duckBody.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
  duckBody.rotation.z = Math.sin(T * 1.3) * 0.03;
  if (du.talk > 0) du.talk -= dt;
  // head: look at camera when talking, at the screen while tests run
  let yawT;
  if (state === 'fixing' || state === 'running') yawT = 1.0;
  else { tv.copy(camera.position).sub(duck.position); yawT = Math.max(-0.9, Math.min(0.9, Math.atan2(tv.x, tv.z) - duck.rotation.y)); }
  du.yaw += (yawT - du.yaw) * Math.min(1, dt * 4);
  duckHead.rotation.y = du.yaw;
  duckHead.rotation.x = du.talk > 0 ? Math.sin(T * 22) * 0.08 : Math.sin(T * 0.9) * 0.03;
  duckHead.rotation.z = Math.sin(T * 0.7) * 0.06;

  // bubble follows the duck
  if (bubble.classList.contains('show')) {
    duckHead.getWorldPosition(headW); headW.y += 0.09; headW.project(camera);
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    let px = (headW.x + 1) / 2 * innerWidth, py = (1 - headW.y) / 2 * innerHeight;
    const cx = Math.max(10, Math.min(innerWidth - bw - 10, px - bw / 2)), cy = Math.max(10, py - bh - 14);
    bubble.style.transform = `translate(${cx.toFixed(1)}px,${cy.toFixed(1)}px)`;
    bubble.style.setProperty('--tail', `${Math.max(16, Math.min(bw - 16, px - cx)).toFixed(0)}px`);
  }

  // mug sip
  const mu = mug.userData;
  if (mu.sip >= 0) { mu.sip += dt; const k = Math.min(1, mu.sip / 1.5), s = Math.sin(k * Math.PI); mug.position.set(0.92 - s * 0.08, s * 0.16, -0.06 + s * 0.14); mug.rotation.x = s * 0.55; if (k >= 1) { mu.sip = -1; mug.position.set(0.92, 0, -0.06); mug.rotation.x = 0; } }
  // steam
  for (const s of steam) {
    const u = s.userData; u.t += dt; if (u.t > 3) u.t -= 3;
    const k = u.t / 3;
    s.position.set(mug.position.x + Math.sin(T * 0.8 + u.ph + k * 4) * 0.02 * (1 + k * 2), mug.position.y + 0.1 + k * 0.28, mug.position.z + Math.cos(T * 0.6 + u.ph) * 0.012);
    s.scale.setScalar(0.04 + k * 0.1);
    s.material.opacity = coffee.visible ? Math.sin(k * Math.PI) * 0.22 : 0;
  }

  // bug
  if (B.state === 0) {

    const sp = 0.045 * (0.5 + 0.5 * Math.sin(T * 0.7)) + 0.01;

    bugLegs.forEach((l, i) => { l.rotation.y = l.userData.base + Math.sin(T * 26 * (sp / 0.05) + (i % 2) * Math.PI) * 0.35; });
  } else if (B.state === 1) {
    B.t += dt; const k = B.t / 0.8; bug.position.y = Math.sin(Math.min(1, k) * Math.PI) * 0.12; bug.rotation.y += dt * 18; bug.scale.setScalar(Math.max(0.001, 1 - k));
    if (k >= 1) { B.state = 2; B.t = 0; bug.visible = false; }
  } else { B.t += dt; if (B.t > 20) { B.state = 0; B.x = rand() < 0.5 ? -1.25 : 0.9; B.z = 0.45 + rand() * 0.1; B.a = B.x < 0 ? 1.4 : -1.4; } }

  // confetti
  let any = false;
  for (let i = 0; i < CONF; i++) {
    const c = cf[i]; if (c.life <= 0) continue; any = true;
    c.life -= dt; c.v.y -= 2.2 * dt; c.v.multiplyScalar(1 - dt * 1.4); c.p.addScaledVector(c.v, dt);
    if (c.p.y < 0.003) { c.p.y = 0.003; c.v.set(0, 0, 0); c.w.multiplyScalar(0.9); }
    c.r.x += c.w.x * dt; c.r.y += c.w.y * dt; c.r.z += c.w.z * dt; cfQ.setFromEuler(c.r);
    cfS.setScalar(c.life > 0 ? Math.min(1, c.life * 2) : 0); kmat.compose(c.p, cfQ, cfS); confetti.setMatrixAt(i, kmat);
  }
  if (any) confetti.instanceMatrix.needsUpdate = true;

  // camera fly
  if (fly) {
    fly.t += dt; const k = Math.min(1, fly.t / 1.2), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(fly.fromP, fly.pos, e); controls.target.lerpVectors(fly.fromT, fly.tgt, e);
    if (k >= 1) { fly = null; controls.enabled = true; }
  }
  controls.update();
  renderer.render(scene, camera);
}
drawScreen();
renderer.setAnimationLoop(loop);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) renderer.setAnimationLoop(null);
  else { last = performance.now(); renderer.setAnimationLoop(loop); }
});
</script>
