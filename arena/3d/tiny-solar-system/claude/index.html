<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiny Solar System</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8eeff;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none;outline:none}
.glass{background:rgba(10,16,36,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(140,170,255,.18);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#hint{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);padding:10px 18px;font-size:14px;line-height:1.45;text-align:center;transition:opacity 1.4s;pointer-events:none;max-width:88vw;z-index:5}
#hint.hide{opacity:0}
#nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:6px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;z-index:4}
#nav::-webkit-scrollbar{display:none}
#nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;font-size:13px;white-space:nowrap;color:#dfe6ff;transition:background .2s}
#nav button:hover{background:rgba(120,150,255,.15)}
#nav button.on{background:rgba(120,150,255,.28)}
#nav button.seen::after{content:"✓";font-size:10px;opacity:.7}
#nav i{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 6px currentColor}
#side{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:8px;z-index:4;min-width:150px}
#side label{display:flex;align-items:center;justify-content:space-between;gap:8px}
#side input[type=range]{width:96px;accent-color:#8fb0ff}
#side .row{display:flex;gap:6px}
#side button{all:unset;cursor:pointer;padding:4px 8px;border-radius:8px;background:rgba(120,150,255,.14);font-size:12px}
#side button.off{opacity:.45}
#info{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));width:min(300px,calc(100vw - 200px));padding:14px 16px;font-size:13px;line-height:1.45;opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s;pointer-events:none;z-index:4}
#info.show{opacity:1;transform:none}
#info h2{margin:0 0 2px;font-size:20px;letter-spacing:.02em}
#info .k{opacity:.65;font-size:12px;margin-bottom:8px}
#info .st{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:10px;font-size:12px}
#info .st b{display:block;font-weight:600;color:#fff}
#info .st span{opacity:.6}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.lbl{position:absolute;left:0;top:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#cfe0ff;padding:2px 6px;border-radius:6px;background:rgba(10,16,36,.45);pointer-events:auto;cursor:pointer;white-space:nowrap;will-change:transform}
#toast{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.94);padding:12px 20px;font-size:15px;opacity:0;transition:opacity .45s,transform .45s;pointer-events:none;text-align:center;max-width:86vw;z-index:6}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:620px){#info{top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 56px);width:calc(100vw - 48px)}#side{min-width:0}#hint{top:auto;bottom:120px}}
</style>
</head>
<body>
<div id="labels"></div>
<div id="hint" class="glass">Drag to orbit · scroll or pinch to zoom<br><span style="opacity:.8">Tap a planet (or use the bar below) to fly there · keys 1–7, Esc for overview</span></div>
<div id="info" class="glass"></div>
<div id="side" class="glass">
  <label>Time <input id="speed" type="range" min="0" max="1" step="0.01" value="0.35"><span id="spv">1×</span></label>
  <div class="row"><button id="bl">Labels</button><button id="bo">Orbits</button></div>
  <div id="visited">Visited 0 / 7</div>
</div>
<div id="nav" class="glass"></div>
<div id="toast" class="glass"></div>
<script type="module">
import * as THREE from "/lib/three/three.module.js";
import { OrbitControls } from "/lib/three/OrbitControls.js";

const $ = id => document.getElementById(id);
const vesta = (fn, ...a) => { try { window.vesta?.[fn]?.(...a); } catch (e) {} };
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 777;
const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function hash3(x, y, z) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1440662683)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = lerp(lerp(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), lerp(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v);
  const b = lerp(lerp(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), lerp(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v);
  return lerp(a, b, w);
}
function fbm3(x, y, z, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; } return s / (1 - Math.pow(0.5, o)); }
const hexRGB = h => { const c = parseInt(h.slice(1), 16); return [c >> 16 & 255, c >> 8 & 255, c & 255]; };
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
let toastTimer = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3600); }

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 3000);
const portrait = () => innerWidth < innerHeight;
camera.position.set(0, 24, 40).multiplyScalar(portrait() ? 1.6 : 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 6; controls.maxDistance = 140; controls.enablePan = false;

// ---------- canvas textures ----------
function sphereTex(fn, w = 256, h = 128, alpha = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); const img = g.createImageData(w, h); const d = img.data;
  for (let y = 0; y < h; y++) {
    const lat = (0.5 - y / (h - 1)) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
    for (let x = 0; x < w; x++) {
      const lon = x / w * Math.PI * 2;
      const col = fn(cl * Math.cos(lon), sl, cl * Math.sin(lon));
      const i = (y * w + x) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = alpha ? col[3] : 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function craters(n, minR, maxR) {
  const list = [];
  for (let i = 0; i < n; i++) { const v = new THREE.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize(); list.push([v.x, v.y, v.z, minR + rand() * (maxR - minR)]); }
  return list;
}
function craterShade(list, x, y, z) {
  let s = 0;
  for (const [cx, cy, cz, r] of list) {
    const d = Math.acos(Math.min(1, x * cx + y * cy + z * cz)) / r;
    if (d < 1.25) s += d < 1 ? -0.25 * (1 - d * d) + 0.18 * smooth(0.75, 1, d) : 0.18 * (1 - smooth(1, 1.25, d));
  }
  return s;
}
const TEX = {
  rocky: () => { const cr = craters(40, 0.05, 0.22); const a = hexRGB('#4e3a30'), b = hexRGB('#b48a6a'), hot = hexRGB('#ff7a30');
    return sphereTex((x, y, z) => { const n = fbm3(x * 3 + 1, y * 3, z * 3, 5); let c = mixc(a, b, n); const s = craterShade(cr, x, y, z); c = c.map(v => v * (1 + s)); const lava = smooth(0.66, 0.72, fbm3(x * 5 + 9, y * 5, z * 5, 3)); return mixc(c, hot, lava * 0.6); }); },
  cloudy: () => { const a = hexRGB('#b8864a'), b = hexRGB('#f6e2b0'), c2 = hexRGB('#e0a860');
    return sphereTex((x, y, z) => { const w = fbm3(x * 1.6, y * 1.6, z * 1.6, 4); const bnd = Math.sin(y * 9 + w * 7) * 0.5 + 0.5; return mixc(mixc(a, b, bnd), c2, smooth(0.55, 0.8, fbm3(x * 4, y * 4, z * 4, 3)) * 0.5); }); },
  earth: () => { const deep = hexRGB('#123a7a'), shal = hexRGB('#2a7ac0'), sand = hexRGB('#d8c890'), grn = hexRGB('#3e8a3a'), dk = hexRGB('#2a5a2a'), mt = hexRGB('#8a7a5a'), ice = hexRGB('#f2f6ff');
    return sphereTex((x, y, z) => { const n = fbm3(x * 1.7 + 3, y * 1.7 + 3, z * 1.7 + 3, 6); const lat = Math.abs(y);
      let c; if (n < 0.5) c = mixc(deep, shal, smooth(0.32, 0.5, n)); else if (n < 0.52) c = sand; else c = mixc(mixc(grn, dk, smooth(0.55, 0.62, n)), mt, smooth(0.62, 0.72, n));
      if (n >= 0.5) c = mixc(c, hexRGB('#c8a860'), smooth(0.1, 0.35, 0.35 - lat) * 0.5 * smooth(0.5, 0.6, fbm3(x * 4, y * 4, z * 4, 2)));
      return mixc(c, ice, smooth(0.78, 0.86, lat + (fbm3(x * 5, y * 5, z * 5, 2) - 0.5) * 0.1)); }); },
  earthClouds: () => sphereTex((x, y, z) => { const n = fbm3(x * 2.4 + 50, y * 4.0, z * 2.4, 5); return [255, 255, 255, 255 * smooth(0.5, 0.72, n) * 0.9]; }, 256, 128, true),
  desert: () => { const a = hexRGB('#8a3a22'), b = hexRGB('#e0864a'), dark = hexRGB('#5a2a1e'), ice = hexRGB('#fff2ea'); const cr = craters(14, 0.04, 0.14);
    return sphereTex((x, y, z) => { const n = fbm3(x * 2.6, y * 2.6, z * 2.6, 5); let c = mixc(a, b, n); c = mixc(c, dark, smooth(0.58, 0.68, fbm3(x * 1.3 + 7, y * 1.3, z * 1.3, 4)) * 0.7); const s = craterShade(cr, x, y, z); c = c.map(v => v * (1 + s * 0.6)); return mixc(c, ice, smooth(0.9, 0.95, Math.abs(y))); }); },
  gas: () => { const pal = ['#7a4a2a', '#d8a06a', '#f2dcb8', '#b8703a', '#e8c090'].map(hexRGB); const spot = new THREE.Vector3(0.7, -0.35, 0.6).normalize(); const sr = hexRGB('#c0503a');
    return sphereTex((x, y, z) => { const w = fbm3(x * 2.5, y * 2.5, z * 2.5, 4); const b = (Math.sin(y * 15 + w * 3.2) * 0.5 + 0.5) * (pal.length - 1); const i = Math.min(pal.length - 2, Math.floor(b)); let c = mixc(pal[i], pal[i + 1], b - i);
      const dx = x - spot.x, dy = (y - spot.y) * 2.2, dz = z - spot.z; const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < 0.32) { const k = 1 - smooth(0.12, 0.32, d); c = mixc(c, mixc(sr, pal[2], Math.sin(d * 40 + w * 4) * 0.25 + 0.25), k); } return c; }); },
  gas2: () => { const a = hexRGB('#c8a870'), b = hexRGB('#f4e6c0'), c2 = hexRGB('#a88a58');
    return sphereTex((x, y, z) => { const w = fbm3(x * 2, y * 2, z * 2, 4); const bnd = Math.sin(y * 11 + w * 2.4) * 0.5 + 0.5; return mixc(mixc(a, b, bnd), c2, smooth(0.6, 0.9, Math.sin(y * 31 + w) * 0.5 + 0.5) * 0.35); }); },
  ice: () => { const a = hexRGB('#3aa8c8'), b = hexRGB('#a8f0ff'), c2 = hexRGB('#2a7aa8');
    return sphereTex((x, y, z) => { const w = fbm3(x * 1.8, y * 1.8, z * 1.8, 4); const bnd = Math.sin(y * 7 + w * 2) * 0.5 + 0.5; return mixc(mixc(c2, a, bnd), b, smooth(0.6, 0.85, w) * 0.5); }); },
  moon: () => { const cr = craters(30, 0.06, 0.25); const a = hexRGB('#6e6a66'), b = hexRGB('#c4c0b8');
    return sphereTex((x, y, z) => { const n = fbm3(x * 3, y * 3, z * 3, 4); return mixc(a, b, n).map(v => v * (1 + craterShade(cr, x, y, z))); }, 128, 64); }
};
function glowTex(inner = 'rgba(255,255,255,1)', mid = 'rgba(255,255,255,0.35)') {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, inner); gr.addColorStop(0.25, mid); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function ringTex(colA, colB, seedOff) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 4; const g = c.getContext('2d'); const img = g.createImageData(512, 4);
  const A = hexRGB(colA), B = hexRGB(colB);
  for (let x = 0; x < 512; x++) {
    const t = x / 511; const n = noise3(t * 60 + seedOff, 0.5, 0.5) * 0.6 + noise3(t * 160, 2.5, seedOff) * 0.4;
    let a = (0.25 + 0.75 * n) * smooth(0, 0.06, t) * smooth(1, 0.9, t);
    if (t > 0.58 && t < 0.63) a *= 0.12;
    const col = mixc(A, B, n);
    for (let y = 0; y < 4; y++) { const i = (y * 512 + x) * 4; img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = a * 255; }
  }
  g.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTex();

// ---------- background ----------
const NOISE_GLSL = `
float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x){ vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float s = 0.0, a = 0.5; for(int i = 0; i < 5; i++){ s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }`;
const nebula = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: NOISE_GLSL + `varying vec3 vD;
  void main(){ vec3 d = normalize(vD);
    float band = exp(-pow(dot(d, normalize(vec3(0.3, 1.0, 0.25))), 2.0) * 7.0);
    float n = fbm(d * 3.0 + 4.0), m = fbm(d * 6.0 - 2.0);
    vec3 c = vec3(0.012, 0.014, 0.035);
    c += vec3(0.32, 0.12, 0.42) * smoothstep(0.45, 0.85, n) * 0.32 * (0.4 + band);
    c += vec3(0.08, 0.28, 0.42) * smoothstep(0.5, 0.9, m) * 0.24 * band;
    c += vec3(0.5, 0.45, 0.4) * band * 0.035 * (0.6 + n);
    gl_FragColor = vec4(c, 1.0); }`
}));
nebula.renderOrder = -10;
scene.add(nebula);
{
  const p = [], c = [], col = new THREE.Color();
  const bandN = new THREE.Vector3(0.3, 1, 0.25).normalize();
  const tA = new THREE.Vector3(1, 0, 0).cross(bandN).normalize(), tB = bandN.clone().cross(tA);
  for (let i = 0; i < 4200; i++) {
    let v;
    if (i < 1800) { const th = rand() * Math.PI * 2, off = (rand() + rand() + rand() - 1.5) * 0.18; v = tA.clone().multiplyScalar(Math.cos(th)).addScaledVector(tB, Math.sin(th)).addScaledVector(bandN, off).normalize(); }
    else v = new THREE.Vector3(rand() * 2 - 1, rand() * 2 - 1, rand() * 2 - 1).normalize();
    v.multiplyScalar(900 + rand() * 300); p.push(v.x, v.y, v.z);
    const t = rand(); col.setHSL(t < 0.2 ? 0.6 : t < 0.35 ? 0.1 : 0.0, t < 0.35 ? 0.6 : 0, 0.55 + rand() * 0.45); c.push(col.r, col.g, col.b);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  var stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true, map: GLOW, transparent: true, depthWrite: false }));
  scene.add(stars);
}

// ---------- sun ----------
const sunU = { uTime: { value: 0 }, uFlare: { value: 0 } };
const SUN_R = 2.4;
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 64, 48), new THREE.ShaderMaterial({
  uniforms: sunU,
  vertexShader: `varying vec3 vP; varying vec3 vN; void main(){ vP = position / ${SUN_R.toFixed(2)}; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: NOISE_GLSL + `uniform float uTime, uFlare; varying vec3 vP; varying vec3 vN;
  void main(){
    float n = fbm(vP * 2.2 + vec3(0.0, uTime * 0.12, uTime * 0.05));
    float g = fbm(vP * 7.0 - vec3(uTime * 0.2, 0.0, uTime * 0.1));
    float v = n * 0.62 + g * 0.38;
    vec3 c = mix(vec3(1.0, 0.36, 0.04), vec3(1.0, 0.82, 0.38), smoothstep(0.32, 0.7, v));
    c = mix(c, vec3(1.0, 1.0, 0.85), smoothstep(0.66, 0.85, v));
    float mu = clamp(vN.z, 0.0, 1.0);
    c *= 0.55 + 0.6 * pow(mu, 0.5);
    c += vec3(1.0, 0.5, 0.15) * pow(1.0 - mu, 3.0) * 0.6;
    c *= 1.15 + uFlare * 0.8;
    gl_FragColor = vec4(c, 1.0); }`
}));
sunMesh.userData.kind = 'sun';
scene.add(sunMesh);
const corona1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xffa040, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.85 }));
corona1.scale.setScalar(SUN_R * 5.5);
const corona2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('rgba(255,255,255,0.6)', 'rgba(255,255,255,0.12)'), color: 0xff6a20, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.6 }));
corona2.scale.setScalar(SUN_R * 14);
scene.add(corona1, corona2);
const sunLight = new THREE.PointLight(0xfff1dc, 3.3, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x4a5a80, 0.7));
// flare particles
const FLN = 160;
const flareGeo = new THREE.BufferGeometry();
flareGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(FLN * 3), 3));
flareGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(FLN * 3), 3));
const flares = new THREE.Points(flareGeo, new THREE.PointsMaterial({ size: 0.35, map: GLOW, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
flares.frustumCulled = false; scene.add(flares);
const flV = new Float32Array(FLN * 3), flL = new Float32Array(FLN);
let flareT = 0;

// ---------- planets ----------
const PLANETS = [
  { name: 'Cinder', kind: 'Scorched rock', r: 0.32, d: 4.9, sp: 1.6, spin: 0.5, tilt: 0.03, tex: 'rocky', col: '#d08a5a', moons: [],

    const Pp = flareGeo.attributes.position.array, Cc = flareGeo.attributes.color.array;
    for (let i = 0; i < FLN; i++) {
      if (flL[i] > 0) { flL[i] -= dt; flV[i * 3 + 0] *= 1 - dt * 0.6; flV[i * 3 + 1] *= 1 - dt * 0.6; flV[i * 3 + 2] *= 1 - dt * 0.6; Pp[i * 3] += flV[i * 3] * dt; Pp[i * 3 + 1] += flV[i * 3 + 1] * dt; Pp[i * 3 + 2] += flV[i * 3 + 2] * dt; }
      const k = Math.max(0, Math.min(1, flL[i])); Cc[i * 3] = k; Cc[i * 3 + 1] = 0.55 * k; Cc[i * 3 + 2] = 0.15 * k;
    }
    flareGeo.attributes.position.needsUpdate = true; flareGeo.attributes.color.needsUpdate = true;
  }
  // camera
  const targetPos = focus === 'comet' ? cometPos : focus ? focus.anchor.getWorldPosition(tmp2) : tmp2.set(0, 0, 0);
  if (fly) {
    fly.t += dt; const k = ease(Math.min(1, fly.t / fly.dur));
    tmp.copy(targetPos).addScaledVector(fly.off, fly.dist);
    camera.position.lerpVectors(fly.fromCam, tmp, k);
    controls.target.lerpVectors(fly.fromTgt, targetPos, k);
    if (fly.t >= fly.dur) { if (fly.P && fly.P !== 'comet') markVisited(fly.P); fly = null; controls.enabled = true; }
  } else if (focus) {
    tmp.copy(targetPos).sub(controls.target); camera.position.add(tmp); controls.target.copy(targetPos);
  }
  controls.update();
  // labels
  if (showLabels) {
    camera.getWorldDirection(camDir);
    for (const P of PLANETS) {
      P.anchor.getWorldPosition(proj); proj.y += P.r * 1.25 + 0.15;
      tmp.copy(proj).sub(camera.position);
      const behind = tmp.dot(camDir) < 0; const dist = tmp.length();
      proj.project(camera);
      const hide = behind || focus === P || Math.abs(proj.x) > 1.1 || Math.abs(proj.y) > 1.1;
      if (hide) { P.lbl.style.display = 'none'; continue; }
      P.lbl.style.display = '';
      P.lbl.style.transform = `translate(${((proj.x + 1) / 2 * innerWidth).toFixed(1)}px,${((1 - proj.y) / 2 * innerHeight).toFixed(1)}px) translate(-50%,-100%)`;
      P.lbl.style.opacity = dist > 90 ? 0.4 : 0.9;
    }
  }
  nebula.position.copy(camera.position); stars.position.copy(camera.position);
  renderer.render(scene, camera);
}
overviewBtn.classList.add('on');
renderer.setAnimationLoop(loop);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) renderer.setAnimationLoop(null);
  else { last = performance.now(); renderer.setAnimationLoop(loop); }
});
</script>
