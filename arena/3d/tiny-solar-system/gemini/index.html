<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tiny Solar System Explorer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030308;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    /* Sleek Sci-Fi HUD */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .hud-panel {
      pointer-events: auto;
      background: rgba(10, 14, 26, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(90, 140, 255, 0.22);
      border-radius: 14px;
      padding: 12px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .hud-title h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #70b8ff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-title p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .hud-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: rgba(30, 45, 75, 0.6);
      border: 1px solid rgba(120, 170, 255, 0.25);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn:hover {
      background: rgba(56, 114, 224, 0.4);
      border-color: rgba(147, 197, 253, 0.6);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn.active {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.5);
    }
    /* Planet Info Card */
    .planet-card {
      position: absolute;
      top: 80px;
      left: 18px;
      width: 260px;
      pointer-events: auto;
      background: rgba(9, 14, 28, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
      display: none;
    }
    .planet-card.active {
      display: block;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .planet-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .planet-card-name {
      font-size: 15px;
      font-weight: 700;
      color: #67e8f9;
    }
    .planet-card-type {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .planet-stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .stat-label { color: #64748b; font-size: 10px; }
    .stat-val { color: #e2e8f0; font-weight: 600; }
    .planet-lore {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.4;
      font-style: italic;
    }
    /* Bottom Deck */
    .hud-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .planet-dock {
      pointer-events: auto;
      display: flex;
      gap: 5px;
      background: rgba(10, 14, 28, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(96, 165, 250, 0.25);
      border-radius: 30px;
      padding: 5px 8px;
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .planet-dock::-webkit-scrollbar { display: none; }
    .dock-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .dock-btn.active {
      background: rgba(59, 130, 246, 0.35);
      color: #60a5fa;
      font-weight: 600;
    }
    /* Hint Banner */
    .hint-banner {
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 24px;
      padding: 8px 18px;
      font-size: 13px;
      color: #bae6fd;
      animation: pulseHint 2.5s infinite ease-in-out;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .hint-banner.fade-out {
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }
    @keyframes pulseHint {
      0%, 100% { border-color: rgba(96, 165, 250, 0.3); box-shadow: 0 0 16px rgba(56, 189, 248, 0.15); }
      50% { border-color: rgba(96, 165, 250, 0.6); box-shadow: 0 0 24px rgba(56, 189, 248, 0.35); }
    }
    @media (max-width: 650px) {
      .hud-header { flex-direction: column; }
      .planet-card { top: auto; bottom: 90px; left: 14px; width: calc(100vw - 28px); }
      .dock-btn { font-size: 10px; padding: 5px 8px; }
      .hint-banner { font-size: 11px; padding: 6px 12px; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud">
    <div class="hud-header">
      <div class="hud-panel hud-title">
        <h1>🌌 Tiny Solar System</h1>
        <p>Interactive Orrery & Planetary Explorer</p>
      </div>

      <div class="hud-panel hud-actions">
        <button id="btn-speed" class="btn">⚡ 1x Speed</button>
        <button id="btn-trails" class="btn active">💫 Orbits</button>
        <button id="btn-audio" class="btn">🔈 Audio</button>
      </div>
    </div>

    <!-- Planet Info Card -->
    <div id="planet-card" class="planet-card">
      <div class="planet-card-header">
        <div>
          <div id="card-name" class="planet-card-name">Terra</div>
          <div id="card-type" class="planet-card-type">Habitable Terrestrial</div>
        </div>
        <button id="card-close" class="btn" style="padding: 2px 8px; font-size: 10px;">✕</button>
      </div>
      <div class="planet-stat-grid">
        <div><span class="stat-label">Orbit Radius:</span> <div id="card-radius" class="stat-val">12.5 AU</div></div>
        <div><span class="stat-label">Period:</span> <div id="card-period" class="stat-val">365 Days</div></div>
        <div><span class="stat-label">Diameter:</span> <div id="card-diam" class="stat-val">12,742 km</div></div>
        <div><span class="stat-label">Moons:</span> <div id="card-moons" class="stat-val">1 (Luna)</div></div>
      </div>
      <div id="card-lore" class="planet-lore">Lush cradle of oceans and atmosphere, teeming with curiosity.</div>
    </div>

    <div class="hud-footer">
      <div id="hint" class="hint-banner">
        🪐 Drag to orbit • Scroll to zoom • Click any celestial body to focus
      </div>

      <div class="planet-dock">
        <button class="dock-btn active" data-target="overview">🔭 Overview</button>
        <button class="dock-btn" data-target="sol">☀️ Sol</button>
        <button class="dock-btn" data-target="pyro">🔥 Pyro</button>
        <button class="dock-btn" data-target="terra">🌍 Terra</button>
        <button class="dock-btn" data-target="ares">🔴 Ares</button>
        <button class="dock-btn" data-target="jove">⚡ Jove</button>
        <button class="dock-btn" data-target="aurelia">🪐 Aurelia</button>
        <button class="dock-btn" data-target="boreas">💎 Boreas</button>
        <button class="dock-btn" data-target="comet">☄️ Comet</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "/lib/three/three.module.js";
    import { OrbitControls } from "/lib/three/OrbitControls.js";

    // --- Web Audio API Celestial Synthesizer ---
    class CosmicAudio {
      constructor() {
        this.ctx = null;
        this.droneGain = null;
        this.enabled = false;
      }
      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();

        // Deep space ambient drone
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.value = 55; // A1
        osc2.frequency.value = 110; // A2

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 180;

        this.droneGain = this.ctx.createGain();
        this.droneGain.gain.value = 0;

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(this.droneGain);
        this.droneGain.connect(this.ctx.destination);

        osc1.start();
        osc2.start();
      }
      toggle() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.enabled = !this.enabled;
        if (this.droneGain) {
          this.droneGain.gain.setTargetAtTime(this.enabled ? 0.09 : 0, this.ctx.currentTime, 0.3);
        }
        return this.enabled;
      }
      playWarp(freq = 440) {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * 0.7, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.4, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.6);
      }
    }

    const sound = new CosmicAudio();

    // --- Procedural Textures ---
    function createSunTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffaa22';
      ctx.fillRect(0, 0, 512, 512);

      // Solar convective granules
      for (let i = 0; i < 2500; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = Math.random() * 12 + 4;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, '#fff4cc');
        grad.addColorStop(0.6, '#ff8800');
        grad.addColorStop(1, 'rgba(210, 70, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createCoronaTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.2, 'rgba(255, 210, 100, 0.85)');
      grad.addColorStop(0.5, 'rgba(255, 120, 30, 0.35)');
      grad.addColorStop(1, 'rgba(255, 60, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    function createPlanetTexture(baseColor, accentColor, featureCount = 1000, isStriped = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, 512, 256);

      if (isStriped) {
        // Latitudinal gas bands
        for (let y = 0; y < 256; y += 4) {
          const t = Math.sin(y * 0.1) * 0.5 + Math.cos(y * 0.04) * 0.5;
          ctx.fillStyle = t > 0.2 ? accentColor : (t < -0.3 ? '#8b4513' : baseColor);
          ctx.fillRect(0, y, 512, 4);
        }
        // Great storm oval
        ctx.fillStyle = '#cc3311';
        ctx.beginPath();
        ctx.ellipse(340, 165, 38, 20, 0.08, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Craters / continents
        ctx.fillStyle = accentColor;
        for (let i = 0; i < featureCount; i++) {
          const x = Math.random() * 512;
          const y = Math.random() * 256;
          const r = Math.random() * 22 + 4;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createSaturnRingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 0);
      grad.addColorStop(0.0, 'rgba(180, 160, 120, 0)');
      grad.addColorStop(0.15, 'rgba(215, 190, 145, 0.6)');
      grad.addColorStop(0.48, 'rgba(235, 215, 175, 0.9)');
      grad.addColorStop(0.53, 'rgba(30, 20, 10, 0.05)'); // Cassini Division!
      grad.addColorStop(0.58, 'rgba(210, 185, 140, 0.75)');
      grad.addColorStop(0.85, 'rgba(170, 140, 100, 0.4)');
      grad.addColorStop(1.0, 'rgba(120, 95, 65, 0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 64);
      return new THREE.CanvasTexture(canvas);
    }

    // --- Scene & Camera ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.2, 1000);
    camera.position.set(0, 38, 48);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2.5;
    controls.maxDistance = 140;

    // --- Cosmic Starfield & Nebula ---
    const starCount = 3500;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      const idx = i * 3;
      const r = 260 + Math.random() * 120;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);

      starPositions[idx] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[idx + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[idx + 2] = r * Math.cos(phi);

      const colorRoll = Math.random();
      if (colorRoll < 0.6) {
        starColors[idx] = 0.9; starColors[idx + 1] = 0.95; starColors[idx + 2] = 1.0; // Blue-white
      } else if (colorRoll < 0.85) {
        starColors[idx] = 1.0; starColors[idx + 1] = 0.9; starColors[idx + 2] = 0.6; // Yellow
      } else {
        starColors[idx] = 1.0; starColors[idx + 1] = 0.55; starColors[idx + 2] = 0.45; // Red giant
      }
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

    const starMat = new THREE.PointsMaterial({
      size: 1.6,
      vertexColors: true,
      map: createCoronaTexture(),
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // Nebula Cloud Backing
    const nebulaCount = 180;
    const nebGeo = new THREE.BufferGeometry();
    const nebPos = new Float32Array(nebulaCount * 3);
    const nebCols = new Float32Array(nebulaCount * 3);

    for (let i = 0; i < nebulaCount; i++) {
      const idx = i * 3;
      const dist = 220 + Math.random() * 60;
      const ang = Math.random() * Math.PI * 2;
      nebPos[idx] = Math.cos(ang) * dist + (Math.random() - 0.5) * 40;
      nebPos[idx + 1] = (Math.random() - 0.5) * 60;
      nebPos[idx + 2] = Math.sin(ang) * dist + (Math.random() - 0.5) * 40;

      nebCols[idx] = 0.25 + Math.random() * 0.3; // Indigo/violet/cyan
      nebCols[idx + 1] = 0.15 + Math.random() * 0.4;
      nebCols[idx + 2] = 0.65 + Math.random() * 0.35;
    }
    nebGeo.setAttribute('position', new THREE.BufferAttribute(nebPos, 3));
    nebGeo.setAttribute('color', new THREE.BufferAttribute(nebCols, 3));

    const nebMat = new THREE.PointsMaterial({
      size: 45,
      vertexColors: true,
      map: createCoronaTexture(),
      transparent: true,
      opacity: 0.18,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    scene.add(new THREE.Points(nebGeo, nebMat));

    // --- The Sun ---
    const sunGroup = new THREE.Group();
    sunGroup.name = "sol";
    scene.add(sunGroup);

    const sunGeo = new THREE.SphereGeometry(3.4, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({
      map: createSunTexture(),
      color: 0xfff0bb
    });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    sunGroup.add(sunMesh);

    // Solar Corona Glow Sprite
    const sunCoronaMat = new THREE.MeshBasicMaterial({
      map: createCoronaTexture(),
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sunCorona = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), sunCoronaMat);
    sunGroup.add(sunCorona);

    // Sunlight Source
    const sunPointLight = new THREE.PointLight(0xffeedd, 3.2, 160, 0.4);
    sunGroup.add(sunPointLight);

    const ambientLight = new THREE.AmbientLight(0x1a2238, 0.45); // Deep space cosmic fill
    scene.add(ambientLight);

    // --- Planetary Database & Construction ---
    const orbitTrailsGroup = new THREE.Group();
    scene.add(orbitTrailsGroup);

    const celestialBodies = {};

    const planetConfigs = [
      {
        id: 'sol',
        name: 'Sol',
        type: 'Yellow Dwarf Star (G2V)',
        radius: 3.4,
        distance: 0,
        speed: 0,
        diam: '1,392,700 km',
        period: '27 Days (Spin)',
        moons: '7 Planets, 1 Comet',
        lore: 'The luminous gravitational anchor of the system, burning with thermonuclear splendor.'
      },
      {
        id: 'pyro',
        name: 'Pyro',
        type: 'Scorched Terrestrial',
        radius: 0.55,
        distance: 6.8,
        speed: 1.6,
        color: '#c2410c',
        accent: '#451a03',
        axialTilt: 0.05,
        diam: '4,879 km',
        period: '88 Days',
        moons: '0',
        lore: 'A blistered obsidian world cracked by intense solar thermal tides and magma geysers.'
      },
      {
        id: 'terra',
        name: 'Terra',
        type: 'Habitable Terrestrial',
        radius: 1.0,
        distance: 11.2,
        speed: 1.0,
        color: '#1d4ed8',
        accent: '#15803d',
        hasClouds: true,
        hasMoon: true,
        axialTilt: 0.41,
        diam: '12,742 km',
        period: '365 Days',
        moons: '1 (Luna)',
        lore: 'A vibrant oasis enveloped in swirling cloud bands, ocean expanses, and thriving biosystems.'
      },
      {
        id: 'ares',
        name: 'Ares',
        type: 'Desert World',
        radius: 0.72,
        distance: 15.5,
        speed: 0.8,
        color: '#dc2626',
        accent: '#7f1d1d',
        hasPolarCap: true,
        hasDualMoons: true,
        axialTilt: 0.44,
        diam: '6,779 km',
        period: '687 Days',
        moons: '2 (Phobos & Deimos)',
        lore: 'The rust-red wanderer, scarred by monumental rift valleys and frozen carbon-dioxide polar caps.'
      },
      {
        id: 'jove',
        name: 'Jove',
        type: 'Gas Giant Colossus',
        radius: 2.2,
        distance: 24.5,
        speed: 0.44,
        color: '#d97706',
        accent: '#fef3c7',
        isStriped: true,
        axialTilt: 0.06,
        diam: '139,820 km',
        period: '11.8 Years',
        moons: '4 Major (Galilean)',
        lore: 'The colossal titan wrapped in turbulent latitudinal jet streams and a raging perpetual storm vortex.'
      },
      {
        id: 'aurelia',
        name: 'Aurelia',
        type: 'Ringed Jewel',
        radius: 1.8,
        distance: 32.5,
        speed: 0.32,
        color: '#eab308',
        accent: '#fef08a',
        hasRings: true,
        axialTilt: 0.47,
        diam: '116,460 km',
        period: '29.4 Years',
        moons: '7 Icy Moons',
        lore: 'Crowned by magnificent crystalline rings, spanning across the velvet void like cosmic jewelry.'
      },
      {
        id: 'boreas',
        name: 'Boreas',
        type: 'Crystalline Ice Giant',
        radius: 1.35,
        distance: 40.0,
        speed: 0.22,
        color: '#06b6d4',
        accent: '#a5f3fc',
        axialTilt: 1.7, // Tilted on its side like Uranus
        diam: '50,724 km',
        period: '84 Years',
        moons: '5 Frost Moons',
        lore: 'A frigid azure jewel tilted dramatically on its side, encircled by a faint diamond dust ring.'
      }
    ];

    // Helper to generate orbital circle line
    function createOrbitLine(dist) {
      const segs = 96;
      const pts = [];
      for (let i = 0; i <= segs; i++) {
        const theta = (i / segs) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(theta) * dist, 0, Math.sin(theta) * dist));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({
        color: 0x4772b8,
        transparent: true,
        opacity: 0.35
      });
      return new THREE.Line(geo, mat);
    }

    // Build Planets
    planetConfigs.forEach(cfg => {
      if (cfg.id === 'sol') {
        celestialBodies['sol'] = {
          pivot: sunGroup,
          mesh: sunMesh,
          config: cfg,
          currentAngle: 0
        };
        return;
      }

      // Orbital line
      const orbitLine = createOrbitLine(cfg.distance);
      orbitTrailsGroup.add(orbitLine);

      // Pivot group at solar center
      const pivot = new THREE.Group();
      scene.add(pivot);

      // Planet Holder (placed at distance along X)
      const planetHolder = new THREE.Group();
      planetHolder.position.x = cfg.distance;
      pivot.add(planetHolder);

      // Planet Sphere
      const geo = new THREE.SphereGeometry(cfg.radius, 28, 28);
      const tex = createPlanetTexture(cfg.color, cfg.accent, 800, cfg.isStriped);
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.75,
        metalness: 0.1
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.name = cfg.id;
      mesh.rotation.z = cfg.axialTilt || 0;
      planetHolder.add(mesh);

      // Atmospheric Clouds for Terra
      let cloudMesh = null;
      if (cfg.hasClouds) {
        const cGeo = new THREE.SphereGeometry(cfg.radius * 1.03, 24, 24);
        const cTex = createPlanetTexture('rgba(0,0,0,0)', 'rgba(255,255,255,0.7)', 600, false);
        const cMat = new THREE.MeshStandardMaterial({
          map: cTex,
          transparent: true,
          opacity: 0.45,
          blending: THREE.AdditiveBlending
        });
        cloudMesh = new THREE.Mesh(cGeo, cMat);
        planetHolder.add(cloudMesh);
      }

      // Moon for Terra
      const moons = [];
      if (cfg.hasMoon) {
        const mPivot = new THREE.Group();
        planetHolder.add(mPivot);
        const mMesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.24, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.9 })
        );
        mMesh.position.x = 2.1;
        mPivot.add(mMesh);
        moons.push({ pivot: mPivot, speed: 2.8 });
      }

      // Dual moons for Ares
      if (cfg.hasDualMoons) {
        const p1 = new THREE.Group();
        planetHolder.add(p1);
        const m1 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.12, 0), new THREE.MeshStandardMaterial({ color: 0x78716c }));
        m1.position.x = 1.3;
        p1.add(m1);
        moons.push({ pivot: p1, speed: 3.5 });

        const p2 = new THREE.Group();
        planetHolder.add(p2);
        const m2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.09, 0), new THREE.MeshStandardMaterial({ color: 0x57534e }));
        m2.position.x = 1.8;
        p2.add(m2);
        moons.push({ pivot: p2, speed: 2.1 });
      }

      // Rings for Aurelia (Saturn)
      if (cfg.hasRings) {
        const ringGeo = new THREE.RingGeometry(cfg.radius * 1.4, cfg.radius * 2.7, 48);
        const ringTex = createSaturnRingTexture();
        const ringMat = new THREE.MeshStandardMaterial({
          map: ringTex,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.9,
          roughness: 0.8
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2 + 0.47;
        planetHolder.add(ringMesh);
      }

      celestialBodies[cfg.id] = {
        pivot,
        holder: planetHolder,
        mesh,
        cloudMesh,
        moons,
        config: cfg,
        currentAngle: Math.random() * Math.PI * 2
      };
    });

    // --- Asteroid Belt ---
    const asteroidBeltCount = 380;
    const asteroidBelt = new THREE.Group();
    scene.add(asteroidBelt);

    const aGeom = new THREE.DodecahedronGeometry(0.12, 0);
    const aMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.95 });
    const instancedAsteroids = new THREE.InstancedMesh(aGeom, aMat, asteroidBeltCount);
    const dummy = new THREE.Object3D();

    for (let i = 0; i < asteroidBeltCount; i++) {
      const radius = 18.5 + Math.random() * 3.5;
      const angle = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.5) * 1.4;
      dummy.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
      const s = Math.random() * 0.8 + 0.4;
      dummy.scale.set(s, s * (Math.random() * 0.4 + 0.8), s);
      dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      dummy.updateMatrix();
      instancedAsteroids.setMatrixAt(i, dummy.matrix);
    }
    asteroidBelt.add(instancedAsteroids);

    // --- The Wandering Comet ---
    const cometGroup = new THREE.Group();
    cometGroup.name = "comet";
    scene.add(cometGroup);

    const cometNucleus = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.42, 1),
      new THREE.MeshStandardMaterial({ color: 0xdbeafe, roughness: 0.6, emissive: 0x93c5fd, emissiveIntensity: 0.4 })
    );
    cometGroup.add(cometNucleus);

    // Glowing Comet Dust & Ion Tail (Particles)
    const tailCount = 180;
    const tailGeo = new THREE.BufferGeometry();
    const tailPos = new Float32Array(tailCount * 3);
    for (let i = 0; i < tailCount; i++) {
      tailPos[i * 3] = (Math.random() - 0.5) * 0.4;
      tailPos[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
      tailPos[i * 3 + 2] = i * 0.12; // Stream behind
    }
    tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
    const cometTail = new THREE.Points(tailGeo, new THREE.PointsMaterial({
      color: 0x67e8f9,
      size: 0.9,
      map: createCoronaTexture(),
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    cometGroup.add(cometTail);

    celestialBodies['comet'] = {
      pivot: cometGroup,
      holder: cometGroup,
      mesh: cometNucleus,
      config: {
        id: 'comet',
        name: 'The Comet',
        type: 'Kuiper Belt Wanderer',
        diam: '8.4 km',
        period: '76 Years',
        moons: '0',
        lore: 'A pristine cosmic snowball streaking across the abyss with a luminous vaporizing ion tail.'
      }
    };

    // --- Interactive Tracking & Exploration System ---
    let currentFocus = 'overview'; // 'overview' or planet id
    let timeSpeed = 1.0;
    const visitedBodies = new Set();

    const planetCard = document.getElementById('planet-card');
    const cardName = document.getElementById('card-name');
    const cardType = document.getElementById('card-type');
    const cardRadius = document.getElementById('card-radius');
    const cardPeriod = document.getElementById('card-period');
    const cardDiam = document.getElementById('card-diam');
    const cardMoons = document.getElementById('card-moons');
    const cardLore = document.getElementById('card-lore');
    const cardClose = document.getElementById('card-close');

    function updateCard(cfg) {
      if (!cfg) return;
      cardName.textContent = cfg.name;
      cardType.textContent = cfg.type;
      cardRadius.textContent = cfg.distance ? `${cfg.distance} AU` : '0 (Center)';
      cardPeriod.textContent = cfg.period || 'N/A';
      cardDiam.textContent = cfg.diam || 'N/A';
      cardMoons.textContent = cfg.moons || '0';
      cardLore.textContent = cfg.lore || '';
      planetCard.classList.add('active');
    }

    cardClose.addEventListener('click', () => {
      planetCard.classList.remove('active');
    });

    function focusOn(targetId) {
      currentFocus = targetId;
      visitedBodies.add(targetId);

      // Update Dock Buttons
      document.querySelectorAll('.dock-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.target === targetId);
      });

      if (targetId === 'overview') {
        planetCard.classList.remove('active');
        controls.target.set(0, 0, 0);
        sound.playWarp(330);
      } else {
        const body = celestialBodies[targetId];
        if (body) {
          updateCard(body.config);
          sound.playWarp(520 + visitedBodies.size * 50);
          window.vesta?.milestone("planet-explored");

          if (visitedBodies.size >= 8) {
            window.vesta?.achievement("cosmic-voyager", "Grand Tour of the Solar System");
          }
        }
      }
    }

    // Dock Buttons Click
    document.querySelectorAll('.dock-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        focusOn(btn.dataset.target);
      });
    });

    // Speed Toggle
    const btnSpeed = document.getElementById('btn-speed');
    const speeds = [0.5, 1.0, 2.5, 6.0];
    let speedIdx = 1;
    btnSpeed.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      timeSpeed = speeds[speedIdx];
      btnSpeed.textContent = `⚡ ${timeSpeed}x Speed`;
    });

    // Trails Toggle
    const btnTrails = document.getElementById('btn-trails');
    btnTrails.addEventListener('click', () => {
      orbitTrailsGroup.visible = !orbitTrailsGroup.visible;
      btnTrails.classList.toggle('active', orbitTrailsGroup.visible);
    });

    // Audio Toggle
    const btnAudio = document.getElementById('btn-audio');
    btnAudio.addEventListener('click', () => {
      const on = sound.toggle();
      btnAudio.textContent = on ? "🔊 Audio" : "🔈 Audio";
      btnAudio.classList.toggle('active', on);
    });

    // Raycasting for Direct 3D Clicking
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.hud-header') || e.target.closest('.hud-footer') || e.target.closest('.planet-card')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const targets = [];
      Object.keys(celestialBodies).forEach(k => {
        targets.push(celestialBodies[k].mesh);
      });

      const hits = raycaster.intersectObjects(targets);
      if (hits.length > 0) {
        const hitMesh = hits[0].object;
        Object.keys(celestialBodies).forEach(k => {
          if (celestialBodies[k].mesh === hitMesh) {
            focusOn(k);
          }
        });
      }
    });

    // Hint fade out
    setTimeout(() => {
      document.getElementById('hint').classList.add('fade-out');
    }, 4500);

    // Resize & Visibility
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    let isTabVisible = true;
    document.addEventListener('visibilitychange', () => {
      isTabVisible = !document.hidden;
    });

    // --- Main Animation Loop ---
    const clock = new THREE.Clock();
    const worldPos = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      if (!isTabVisible) return;

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Rotate Sun & Corona
      sunMesh.rotation.y += delta * 0.15;
      sunCorona.lookAt(camera.position);

      // Orbit & Rotate Planets
      Object.keys(celestialBodies).forEach(k => {
        const body = celestialBodies[k];
        if (k === 'sol') return;

        if (k === 'comet') {
          // Highly eccentric inclined Keplerian path
          const cometT = time * 0.25 * timeSpeed;
          const a = 28.0;
          const e = 0.75;
          const r = (a * (1 - e * e)) / (1 + e * Math.cos(cometT));
          const cx = Math.cos(cometT) * r;
          const cz = Math.sin(cometT) * r * 0.6;
          const cy = Math.sin(cometT) * 7.0; // Inclination
          cometGroup.position.set(cx, cy, cz);
          cometTail.lookAt(0, 0, 0); // Tail points away from sun
          cometTail.rotation.y += Math.PI;
          return;
        }

        // Keplerian angular progression
        body.currentAngle += (body.config.speed * 0.35 * delta * timeSpeed);
        body.holder.position.x = Math.cos(body.currentAngle) * body.config.distance;
        body.holder.position.z = Math.sin(body.currentAngle) * body.config.distance;

        // Axial spin
        body.mesh.rotation.y += delta * 0.8;

        if (body.cloudMesh) {
          body.cloudMesh.rotation.y += delta * 0.95;
        }

        // Moons orbit
        if (body.moons && body.moons.length > 0) {
          body.moons.forEach(m => {
            m.pivot.rotation.y += delta * m.speed * timeSpeed;
          });
        }
      });

      // Slowly rotate Asteroid Belt
      asteroidBelt.rotation.y += delta * 0.04 * timeSpeed;

      // Camera Tracking System
      if (currentFocus === 'overview') {
        // Free OrbitControls around solar center
      } else if (currentFocus === 'sol') {
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.05);
      } else {
        const targetBody = celestialBodies[currentFocus];
        if (targetBody) {
          targetBody.holder.getWorldPosition(worldPos);
          // Smoothly glide orbit center onto the focused planet
          controls.target.lerp(worldPos, 0.08);

          // If camera gets too far behind in fast motion, drag camera along
          const distToTarget = camera.position.distanceTo(controls.target);
          if (distToTarget > 25) {
            camera.position.lerp(worldPos.clone().add(new THREE.Vector3(0, 6, 12)), 0.04);
          }
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
