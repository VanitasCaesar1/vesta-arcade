<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Floating Island · Sunset</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a30;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none;outline:none}
.pill{background:rgba(32,16,42,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#hint{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);padding:10px 18px;font-size:14px;line-height:1.45;text-align:center;transition:opacity 1.4s ease;pointer-events:none;max-width:88vw}
#hint.hide{opacity:0}
#panel{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;white-space:nowrap}
#panel input{width:min(44vw,230px);accent-color:#ffa860}
#gems{position:fixed;right:12px;bottom:max(16px,env(safe-area-inset-bottom));padding:8px 12px;font-size:13px;opacity:.9}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.94);padding:12px 20px;font-size:15px;opacity:0;transition:opacity .45s,transform .45s;pointer-events:none;text-align:center;max-width:86vw}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:560px){#gems{bottom:auto;top:max(12px,env(safe-area-inset-top));right:10px}#hint{top:58px;font-size:13px}}
</style>
</head>
<body>
<div id="hint" class="pill">Drag to look around · pinch or scroll to zoom<br><span style="opacity:.8">Tap the waterfall, trees and hut · 3 crystals are hidden on and around the island</span></div>
<div id="panel" class="pill"><span title="Sunset">🌅</span><input id="tod" type="range" min="0" max="1" step="0.001" value="0.35" aria-label="Time of day"><span title="Night">🌙</span></div>
<div id="gems" class="pill">✦ Crystals 0 / 3</div>
<div id="toast" class="pill"></div>
<script type="module">
import * as THREE from "/lib/three/three.module.js";
import { OrbitControls } from "/lib/three/OrbitControls.js";

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const vesta = (fn, ...a) => { try { window.vesta?.[fn]?.(...a); } catch (e) {} };
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 20241;
const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function hash3(x, y, z) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1440662683)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = lerp(lerp(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), lerp(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v);
  const b = lerp(lerp(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), lerp(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v);
  return lerp(a, b, w);
}
function fbm3(x, y, z, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; } return s; }
const srgb = hex => { const c = parseInt(hex.slice(1), 16); return new THREE.Vector3((c >> 16 & 255) / 255, (c >> 8 & 255) / 255, (c & 255) / 255); };
const setSRGB = (color, v) => color.setRGB(v.x, v.y, v.z, THREE.SRGBColorSpace);

let toastTimer = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3400); }

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe89a7a, 45, 230);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);
camera.position.set(17, 5.5, 15);
if (innerWidth < innerHeight) camera.position.multiplyScalar(1.45);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 7;
controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI * 0.88;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
let lastInteract = performance.now();
controls.addEventListener('start', () => { controls.autoRotate = false; lastInteract = performance.now(); });
controls.addEventListener('end', () => { lastInteract = performance.now(); });

// ---------- textures ----------
function glowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function cloudTex() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 24; i++) {
    const x = 52 + rand() * 152, y = 48 + rand() * 36, r = 15 + rand() * 23;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.5)'); gr.addColorStop(0.6, 'rgba(255,255,255,0.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 128);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function moonTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(200,215,255,0.9)'); gr.addColorStop(0.3, 'rgba(160,180,255,0.25)'); gr.addColorStop(1, 'rgba(120,140,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#eef2ff'; g.beginPath(); g.arc(64, 64, 22, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(150,160,190,0.5)';
  [[58, 58, 5], [71, 66, 4], [62, 73, 3], [70, 55, 2.5]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTex();
const CLOUDS = [cloudTex(), cloudTex(), cloudTex()];

// ---------- sky ----------
const skyU = {
  uTop: { value: srgb('#2a3a7a') }, uMid: { value: srgb('#e0707e') }, uHor: { value: srgb('#ff8040') }, uLow: { value: srgb('#6a3a70') },
  uSunDir: { value: new THREE.Vector3(0.5, 0.15, -0.8) }, uSunCol: { value: srgb('#ff9a5a') }
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 20), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uTop,uMid,uHor,uLow,uSunDir,uSunCol; varying vec3 vDir;
  void main(){ vec3 d = normalize(vDir); float h = d.y; vec3 col;
    if(h > 0.0){ col = mix(uHor, uMid, smoothstep(0.0, 0.2, h)); col = mix(col, uTop, smoothstep(0.16, 0.8, h)); }
    else { col = mix(uHor, uLow, smoothstep(0.0, -0.35, h)); }
    vec3 sd = normalize(uSunDir); float s = max(dot(d, sd), 0.0);
    float vis = smoothstep(-0.14, 0.02, sd.y);
    float band = exp(-abs(h - sd.y * 0.3) * 9.0);
    col += uSunCol * (pow(s, 5.0) * 0.38 + pow(s, 60.0) * 0.6 + band * pow(s, 2.0) * 0.12) * vis;
    col += vec3(1.0, 0.93, 0.78) * smoothstep(0.9988, 0.9995, s) * vis;
    gl_FragColor = vec4(col, 1.0); }`
}));
sky.renderOrder = -10;
scene.add(sky);

// stars
const starGeo = new THREE.BufferGeometry();
{
  const p = [], c = [];
  for (let i = 0; i < 1100; i++) {
    const u = rand() * 2 - 1, th = rand() * Math.PI * 2; const y = Math.abs(u) * 0.95 + 0.02; const r = Math.sqrt(1 - y * y);
    p.push(Math.cos(th) * r * 260, y * 260, Math.sin(th) * r * 260);
    const b = 0.4 + rand() * 0.6; c.push(b, b, b * (0.9 + rand() * 0.2));
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  starGeo.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
}
const starMat = new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, map: GLOW, vertexColors: true, transparent: true, opacity: 0, depthWrite: false, fog: false });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);
const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex(), transparent: true, opacity: 0, depthWrite: false, fog: false }));
const MOON_DIR = new THREE.Vector3(-0.62, 0.42, 0.66).normalize();
moon.position.copy(MOON_DIR).multiplyScalar(240); moon.scale.setScalar(46);
scene.add(moon);

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0x8a70b0, 0xb8604a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xff8a4a, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 90 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun);
const moonLight = new THREE.DirectionalLight(0x8aa8ff, 0);
moonLight.position.copy(MOON_DIR).multiplyScalar(30);
scene.add(moonLight);

// ---------- island shape ----------
const R = 6;
const edgeR = a => R * (0.8 + 0.45 * fbm3(Math.cos(a) * 1.4 + 5, Math.sin(a) * 1.4 + 5, 2.3, 3));
const zc = x => 0.35 * Math.sin(x * 0.9 + 0.6);
const POND = { x: -1.2, z: 0.4, r: 1.25 };
const WL = 0.3;
function carveAt(x, z) {
  const dp = Math.hypot(x - POND.x, z - POND.z);
  const pond = 1 - smooth(POND.r - 0.1, POND.r + 0.45, dp);
  let riv = 0;
  if (x > POND.x) riv = 1 - smooth(0.3, 0.7, Math.abs(z - zc(x)));
  return Math.max(pond, riv);
}
const HILL = { x: -2.6, z: -2.2 };
function heightAt(x, z) {
  const a = Math.atan2(z, x), t = Math.hypot(x, z) / edgeR(a);
  let h = 0.8 + 0.9 * (fbm3(x * 0.25 + 11, z * 0.25 + 7, 1.3, 4) - 0.45);
  h += 1.5 * Math.exp(-((x - HILL.x) ** 2 + (z - HILL.z) ** 2) / 4.5);
  h += 0.7 * Math.exp(-((x - 1.5) ** 2 + (z - 3) ** 2) / 3);
  const e = smooth(0.8, 1.0, t); h = h * (1 - e) + 0.45 * e;
  const c = carveAt(x, z); h = h * (1 - c) + 0.16 * c;
  return h;
}
// waterfall lip position (where the river meets the edge)
let EDGE_X = edgeR(0);
for (let k = 0; k < 6; k++) { const a = Math.atan2(zc(EDGE_X), EDGE_X); EDGE_X = edgeR(a) * Math.cos(a); }
const WZ = zc(EDGE_X);

const C = {
  grass: new THREE.Color('#6aa83f'), grass2: new THREE.Color('#4a8a30'), grassL: new THREE.Color('#a8c858'),
  sand: new THREE.Color('#d6c08a'), bed: new THREE.Color('#5e6a4e'), dirt: new THREE.Color('#7a5434'),
  rock1: new THREE.Color('#8b6b4e'), rock2: new THREE.Color('#665449'), rockD: new THREE.Color('#3a302c'), moss: new THREE.Color('#4f6e2e')
};
function makeGeo(pos, col, idx) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function gridIdx(rows, cols) {
  const idx = [], W = cols + 1;
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) { const a = i * W + j, b = a + 1, c = a + W, d = c + 1; idx.push(a, b, c, b, d, c); }
  return idx;
}
const island = new THREE.Group();
scene.add(island);
const NR = 46, NS = 120, NU = 30, DEPTH = 7.4;
const rimY = new Float32Array(NS + 1);
const cA = new THREE.Color();
{
  const pos = [], col = [];
  for (let i = 0; i <= NR; i++) {
    const t = i / NR;
    for (let j = 0; j <= NS; j++) {
      const a = j / NS * Math.PI * 2, r = t * edgeR(a);
      const x = r * Math.cos(a), z = r * Math.sin(a), y = heightAt(x, z);
      if (i === NR) rimY[j] = y;
      pos.push(x, y, z);
      const n = fbm3(x * 0.7, z * 0.7, 4.2, 3), c = carveAt(x, z);
      cA.copy(C.grass2).lerp(C.grass, smooth(0.3, 0.62, n)).lerp(C.grassL, smooth(0.9, 2.0, y) * 0.75);
      cA.lerp(C.sand, smooth(0.3, 0.7, c)).lerp(C.bed, smooth(0.8, 1.0, c));
      cA.lerp(C.dirt, smooth(0.93, 1.0, t) * 0.8);
      col.push(cA.r, cA.g, cA.b);
    }
  }
  const top = new THREE.Mesh(makeGeo(pos, col, gridIdx(NR, NS)), new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
  top.castShadow = top.receiveShadow = true; top.userData.kind = 'ground';
  island.add(top);
}
function underPoint(t, a, ry) {
  const er = edgeR(a), ca = Math.cos(a), sa = Math.sin(a);
  const w = smooth(0, 0.12, t);
  const bump = (fbm3(ca * 2.2 + 3, t * 4, sa * 2.2 + 3, 3) - 0.45) * w;
  const r = Math.max(0, er * Math.pow(1 - t, 0.85) * (1 + 0.12 * Math.sin(t * Math.PI) + bump * 0.7));
  const y = ry * (1 - t) - DEPTH * Math.pow(t, 1.15) + (fbm3(ca * 3 + 9, sa * 3 + 9, t * 2, 2) - 0.45) * 1.3 * w * (1 - t);
  return [r * ca + t * t * 0.9, y, r * sa - t * t * 0.6];
}
{
  const pos = [], col = [];
  for (let i = 0; i <= NU; i++) {
    const t = i / NU;
    for (let j = 0; j <= NS; j++) {
      const a = j / NS * Math.PI * 2; const [x, y, z] = underPoint(t, a, rimY[j]);
      pos.push(x, y, z);
      const sN = fbm3(x * 0.5, y * 1.3, z * 0.5, 3);
      const band = Math.sin(y * 2.3 + sN * 5) * 0.5 + 0.5;
      cA.copy(C.rock1).lerp(C.rock2, band).lerp(C.rockD, smooth(0.35, 1.0, t));
      cA.lerp(C.moss, (1 - smooth(0.04, 0.16, t)) * smooth(0.45, 0.6, sN) * 0.8);
      cA.lerp(C.dirt, 1 - smooth(0.0, 0.06, t));
      col.push(cA.r, cA.g, cA.b);
    }
  }
  const under = new THREE.Mesh(makeGeo(pos, col, gridIdx(NU, NS)), new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  under.receiveShadow = true; under.castShadow = true; under.userData.kind = 'ground';
  island.add(under);
}
// hanging rocks under the island
const rockMat = new THREE.MeshStandardMaterial({ color: '#6b5648', flatShading: true, roughness: 1 });
function jitter(geo, amt, off = 0) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    p.setXYZ(i, x + (noise3(x * 2.1 + off, y * 2.1, z * 2.1) - 0.5) * amt * 2, y + (noise3(x * 2.1, y * 2.1 + off + 5, z * 2.1) - 0.5) * amt * 2, z + (noise3(x * 2.1, y * 2.1, z * 2.1 + off + 9) - 0.5) * amt * 2);
  }
  geo.computeVertexNormals(); return geo;
}
for (let k = 0; k < 7; k++) {
  const a = rand() * Math.PI * 2, t = 0.25 + rand() * 0.45;
  if (Math.abs(Math.atan2(Math.sin(a), Math.cos(a))) < 0.5) continue; // keep clear of the waterfall
  const p = underPoint(t, a, 0.4);
  const g = jitter(new THREE.ConeGeometry(0.25 + rand() * 0.25, 1 + rand() * 1.5, 6, 2), 0.08, k);
  g.rotateX(Math.PI);
  const m = new THREE.Mesh(g, rockMat);
  m.position.set(p[0] * 0.92, p[1] - 0.4, p[2] * 0.92);
  island.add(m);
}

// ---------- water ----------
const waterU = { uTime: { value: 0 }, uSky: { value: srgb('#ff9a6a') }, uDeep: { value: srgb('#1f5a6a') }, uDim: { value: 1 } };
const water = new THREE.Mesh(new THREE.PlaneGeometry(EDGE_X + 2.85, 4, 1, 1), new THREE.ShaderMaterial({
  uniforms: waterU, transparent: true, depthWrite: false,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uTime, uDim; uniform vec3 uSky, uDeep; varying vec3 vW;
  float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
  void main(){
    float dp = length(vW.xz - vec2(${POND.x.toFixed(3)}, ${POND.z.toFixed(3)}));
    float pond = 1.0 - smoothstep(${(POND.r - 0.1).toFixed(3)}, ${(POND.r + 0.45).toFixed(3)}, dp);
    float zc = 0.35 * sin(vW.x * 0.9 + 0.6);
    float riv = vW.x > ${POND.x.toFixed(3)} ? 1.0 - smoothstep(0.3, 0.7, abs(vW.z - zc)) : 0.0;
    float m = max(pond, riv);
    if(m < 0.02 || vW.x > ${(EDGE_X + 0.05).toFixed(3)}) discard;
    float flow = riv > pond ? uTime * 1.2 : uTime * 0.25;
    float r = n(vec2(vW.x * 3.0 - flow, vW.z * 5.0)) * 0.6 + n(vec2(vW.x * 7.0 - flow * 1.7, vW.z * 9.0 + uTime * 0.3)) * 0.4;
    vec3 c = mix(uDeep, uSky, 0.45 + 0.35 * r);
    c += uSky * smoothstep(0.82, 0.95, r) * 0.6;
    gl_FragColor = vec4(c * uDim, 0.86); }`
}));
water.rotation.x = -Math.PI / 2;
water.position.set((EDGE_X - 2.75) / 2, WL, 0.35);
water.userData.kind = 'water';
island.add(water);

// waterfall ribbon
const wfU = { uTime: { value: 0 }, uFoam: { value: srgb('#fff3e6') }, uDeep: { value: srgb('#6fb0c8') }, uSun: { value: srgb('#ff9a5a') }, uDim: { value: 1 } };
const WF_SEG = 64, WF_W = 10, FALL_T = 3.3, G = 2.75;
const wfPoint = s => { const tau = s * FALL_T; return [EDGE_X + 0.05 + 1.15 * tau, WL - 0.5 * G * tau * tau]; };
{
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= WF_SEG; i++) {
    const s = i / WF_SEG, [x, y] = wfPoint(s), w = 0.8 + 0.9 * s;
    for (let k = 0; k <= WF_W; k++) { const f = k / WF_W * 2 - 1; pos.push(x + (1 - f * f) * w * 0.32 * smooth(0, 0.08, s), y, WZ + f * w * 0.5); uv.push(k / WF_W, s); }
  }
  for (let i = 0; i < WF_SEG; i++) for (let k = 0; k < WF_W; k++) { const a = i * (WF_W + 1) + k, b = a + 1, c = a + WF_W + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  var waterfall = new THREE.Mesh(g, new THREE.ShaderMaterial({

    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,

  setSRGB(sun.color, mix('sun'));
  sun.intensity = lerp(a.sunI, b.sunI, f) * smooth(-0.07, 0.08, elev);
  setSRGB(hemi.color, mix('hs')); setSRGB(hemi.groundColor, mix('hg')); hemi.intensity = lerp(a.hI, b.hI, f);
  setSRGB(scene.fog.color, mix('fog'));
  night = smooth(0.5, 0.92, v);
  moonLight.intensity = night * 0.7;
  starMat.opacity = night; moon.material.opacity = night;
  fireflies.material.opacity = night;
  const c1 = tv.lerpVectors(a.c1, b.c1, f).clone(), c2 = tv2.lerpVectors(a.c2, b.c2, f);
  for (const s of cloudSprites) setSRGB(s.material.color, tv.lerpVectors(c1, c2, s.userData.tint));
  const dim = 1 - night * 0.7;
  waterU.uDim.value = wfU.uDim.value = dim;
  waterU.uSky.value.copy(mix('hor'));
  wfU.uSun.value.copy(mix('sun')).multiplyScalar(1 - night);
  winMat.emissiveIntensity = hut.userData.on ? 0.5 + night * 2.5 : 0.05;
  hutLight.intensity = hut.userData.on ? night * 9 : 0;
  smoke.material.color.setScalar(0.55 - night * 0.35);
}
const todInput = $('tod');
let tod = parseFloat(todInput.value), todTarget = tod;
let nightAnnounced = false;
todInput.addEventListener('input', () => {
  todTarget = parseFloat(todInput.value);
  if (todTarget > 0.85 && !nightAnnounced) { nightAnnounced = true; vesta('milestone', 'nightfall'); toast('Night falls… the fireflies wake up ✨'); }
});
applyTime(tod);

// ---------- interaction ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = [island, ...floatRocks];
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (dx * dx + dy * dy < 80 && performance.now() - down.t < 600) pick(e.clientX, e.clientY);
  down = null;
});
function pick(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, true);
  let first = null;
  for (const h of hits) {
    let o = h.object; while (o && !o.userData.kind) o = o.parent;
    if (!o) continue;
    const k = o.userData.kind;
    if (k === 'crystal') { if (!o.userData.found) { collect(o); return; } continue; }
    if (k === 'ground') break;
    if (!first) first = o;
  }
  if (first) activate(first);
}
let rainbowDone = false, hutDone = false;
function activate(o) {
  const k = o.userData.kind;
  if (k === 'tree') { o.userData.wob = 1; }
  else if (k === 'waterfall' || k === 'water') {
    rainbowT = 9; rainbow.visible = true;
    if (!rainbowDone) { rainbowDone = true; vesta('milestone', 'rainbow'); toast(night > 0.5 ? 'A moonbow shimmers in the mist 🌈' : 'A rainbow forms in the waterfall mist 🌈'); }
  } else if (k === 'hut') {
    o.userData.on = !o.userData.on; applyTime(tod);
    toast(o.userData.on ? 'Someone lit the lanterns 🏮' : 'Lights out. Shh, someone is sleeping 💤');
    if (!hutDone) { hutDone = true; vesta('milestone', 'cozy-hut'); }
  }
}
const tmpV = new THREE.Vector3();
function collect(c) {
  c.userData.found = true; c.userData.anim = 0; found++;
  $('gems').textContent = `✦ Crystals ${found} / 3`;
  c.getWorldPosition(burstOrigin);
  const P = burst.geometry.attributes.position.array, V = burst.userData.vel;
  for (let i = 0; i < 60; i++) {
    P[i * 3] = burstOrigin.x; P[i * 3 + 1] = burstOrigin.y; P[i * 3 + 2] = burstOrigin.z;
    tmpV.set(rand() - 0.5, rand() - 0.3, rand() - 0.5).normalize().multiplyScalar(1.5 + rand() * 2.5);
    V[i * 3] = tmpV.x; V[i * 3 + 1] = tmpV.y; V[i * 3 + 2] = tmpV.z;
    burst.userData.max[i] = burst.userData.life[i] = 0.8 + rand() * 0.8;
  }
  burst.material.color.copy(c.userData.mat.color);
  vesta('milestone', 'crystal-' + found);
  if (found === 3) {
    toast('All three crystals found! The old rune on the hill awakens ✦');
    vesta('achievement', 'crystal-keeper', 'Crystal Keeper');
    rune.visible = beam.visible = true;
  } else toast(['', 'A crystal! Two more are hidden somewhere…', 'Another one! Just one left…'][found]);
}

// ---------- resize / visibility ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
});
setTimeout(() => $('hint').classList.add('hide'), 6500);

// ---------- loop ----------
let last = performance.now(), T = 0;
function loop() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (Math.abs(todTarget - tod) > 1e-4) { tod += (todTarget - tod) * Math.min(1, dt * 4); applyTime(tod); }
  if (!controls.autoRotate && now - lastInteract > 10000) controls.autoRotate = true;

  waterU.uTime.value = T; wfU.uTime.value = T; runeU.uTime.value = T;
  updateParticles(spray, respawnSpray, dt, 6, 0.55 * (1 - night * 0.6));
  updateParticles(mist, respawnMist, dt, 0, 0.18 * (1 - night * 0.6));
  updateParticles(smoke, respawnSmoke, dt, -0.02, 0.9);
  updateParticles(burst, respawnBurst, dt, 1.5, 1);

  // fireflies
  if (night > 0.01) {
    const P = fireflies.geometry.attributes.position.array, Cc = fireflies.geometry.attributes.color.array;
    for (let i = 0; i < FF; i++) {
      const b = ffBase[i];
      P[i * 3] = b[0] + Math.sin(T * 0.5 + b[3]) * 0.6; P[i * 3 + 1] = b[1] + Math.sin(T * 0.9 + b[3] * 2) * 0.3; P[i * 3 + 2] = b[2] + Math.cos(T * 0.4 + b[3]) * 0.6;
      const f = Math.max(0, Math.sin(T * 2.2 + b[3] * 5)); Cc[i * 3] = Cc[i * 3 + 1] = Cc[i * 3 + 2] = f * f;
    }
    fireflies.geometry.attributes.position.needsUpdate = true; fireflies.geometry.attributes.color.needsUpdate = true;
  }
  // island bob
  island.position.y = Math.sin(T * 0.4) * 0.15;
  // floating rocks
  floatRocks.forEach((g, i) => { const b = g.userData.base; g.position.set(b.x, b.y + Math.sin(T * 0.6 + g.userData.ph) * 0.35, b.z); g.rotation.y = T * 0.05 * (i % 2 ? 1 : -1); });
  // trees
  for (const t of trees) {
    const u = t.userData; if (u.wob > 0.001) u.wob *= Math.exp(-dt * 2.2);
    t.rotation.z = Math.sin(T * 0.8 + u.ph) * 0.015 + Math.sin(T * 13) * 0.18 * u.wob;
  }
  // birds
  birds.forEach(b => {
    const u = b.userData, a = T * 0.11 + u.off, a2 = a + 0.02;
    b.position.set(Math.cos(a) * u.rad, u.h + Math.sin(T * 0.5 + u.ph) * 0.5, Math.sin(a) * u.rad);
    b.lookAt(Math.cos(a2) * u.rad, u.h + Math.sin(T * 0.5 + u.ph + 0.01) * 0.5, Math.sin(a2) * u.rad);
    const fl = Math.sin(T * 9 + u.ph) * 0.65; u.l.rotation.z = fl; u.r.rotation.z = -fl;
  });
  // crystals
  for (const c of crystals) {
    const u = c.userData;
    if (u.anim >= 0) {
      u.anim += dt; const k = u.anim / 1.2;
      c.scale.setScalar(Math.max(0.001, (1 - k) * (1 + k)) * (c.parent === floatRocks[1] ? 1.6 : 1));
      c.rotation.y += dt * 10; if (k >= 1) { c.visible = false; u.anim = -2; }
    } else if (u.anim === -1) {
      u.glow.material.opacity = 0.6 + Math.sin(T * 3 + c.id) * 0.3;
      u.glow.scale.setScalar(1.8 + Math.sin(T * 2 + c.id) * 0.3);
    }
  }
  // rainbow
  if (rainbowT > 0) {
    rainbowT -= dt; rainbowU.uA.value = smooth(0, 2, rainbowT) * smooth(9, 7.5, rainbowT) * (1 - night * 0.6);
    rainbow.lookAt(camera.position.x, rainbow.position.y, camera.position.z);
    if (rainbowT <= 0) rainbow.visible = false;
  }
  if (rune.visible) { runeU.uA.value = Math.min(1, runeU.uA.value + dt * 0.4); rune.rotation.z = T * 0.2; }
  clouds.rotation.y = T * 0.006;
  sky.position.copy(camera.position); stars.position.copy(camera.position); moon.position.copy(camera.position).addScaledVector(MOON_DIR, 240);

  controls.update(dt);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(loop);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) renderer.setAnimationLoop(null);
  else { last = performance.now(); renderer.setAnimationLoop(loop); }
});
</script>
</body>
