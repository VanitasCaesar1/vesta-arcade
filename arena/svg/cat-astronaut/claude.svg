<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="earth" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5fb4ff"/>
      <stop offset="0.7" stop-color="#1f5fb8"/>
      <stop offset="1" stop-color="#0e2f6b"/>
    </radialGradient>
    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.88" stop-color="#7fd3ff" stop-opacity="0"/>
      <stop offset="0.95" stop-color="#9fe0ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#9fe0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="suit" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d1db"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#e8f7ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fb8e6" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="lightstrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="1" stop-color="#e4ecf5"/>
    </linearGradient>
    <radialGradient id="drop" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset="1" stop-color="#5ab8e8" stop-opacity="0.7"/>
    </radialGradient>
    <clipPath id="windowClip"><circle cx="400" cy="280" r="84"/></clipPath>
  </defs>

  <!-- module interior, one-point perspective -->
  <polygon points="0,0 800,0 550,160 250,160" fill="#c8d0da"/>
  <polygon points="0,600 800,600 550,400 250,400" fill="#b9c2cd"/>
  <polygon points="0,0 250,160 250,400 0,600" fill="#d5dce4"/>
  <polygon points="800,0 550,160 550,400 800,600" fill="#d0d7e0"/>
  <rect x="250" y="160" width="300" height="240" fill="#e6ebf1"/>

  <!-- ceiling light strip -->
  <polygon points="320,0 480,0 430,160 370,160" fill="url(#lightstrip)"/>
  <polygon points="320,0 480,0 430,160 370,160" fill="none" stroke="#a9b3bf" stroke-width="2"/>

  <!-- panel seams -->
  <g stroke="#a3adba" stroke-width="2" fill="none">
    <!-- left wall verticals -->
    <line x1="85" y1="54" x2="85" y2="532"/>
    <line x1="170" y1="109" x2="170" y2="464"/>
    <!-- right wall verticals -->
    <line x1="715" y1="54" x2="715" y2="532"/>
    <line x1="630" y1="109" x2="630" y2="464"/>
    <!-- floor/ceiling cross seams -->
    <line x1="133" y1="85" x2="667" y2="85"/>
    <line x1="106" y1="515" x2="694" y2="515"/>
    <line x1="190" y1="448" x2="610" y2="448"/>
    <line x1="200" y1="128" x2="600" y2="128"/>
    <!-- edges -->
    <rect x="250" y="160" width="300" height="240"/>
    <line x1="0" y1="0" x2="250" y2="160"/><line x1="800" y1="0" x2="550" y2="160"/>
    <line x1="0" y1="600" x2="250" y2="400"/><line x1="800" y1="600" x2="550" y2="400"/>
  </g>

  <!-- handrails -->
  <g stroke="#e8b84a" stroke-width="8" stroke-linecap="round">
    <line x1="20" y1="330" x2="230" y2="304"/>
    <line x1="780" y1="330" x2="570" y2="304"/>
    <line x1="290" y1="380" x2="510" y2="380"/>
  </g>
  <g stroke="#b88a2a" stroke-width="5" stroke-linecap="round">
    <line x1="30" y1="330" x2="30" y2="342"/><line x1="220" y1="306" x2="220" y2="314"/>
    <line x1="770" y1="330" x2="770" y2="342"/><line x1="580" y1="306" x2="580" y2="314"/>
  </g>

  <!-- left wall: strapped laptop + cargo bag -->
  <polygon points="40,150 140,130 140,200 40,226" fill="#3b4250"/>
  <polygon points="48,158 132,141 132,192 48,214" fill="#2c6e8f"/>
  <polyline points="56,200 72,190 86,194 102,176 124,170" stroke="#7ff0c0" stroke-width="2.5" fill="none"/>
  <polygon points="40,226 140,200 150,214 50,242" fill="#59616f"/>
  <polygon points="100,380 210,350 210,430 100,480" fill="#f1f3f5" stroke="#b8c0ca" stroke-width="2"/>
  <path d="M130 372 L130 466 M180 358 L180 444" stroke="#3d6fd1" stroke-width="5"/>
  <!-- cable loops -->
  <path d="M200 160 C230 190 180 220 214 250 C240 272 200 290 230 300" stroke="#d64545" stroke-width="3" fill="none"/>
  <path d="M206 158 C240 186 192 222 222 248" stroke="#3a3f4a" stroke-width="3" fill="none"/>

  <!-- right wall: control panel + plant chamber -->
  <polygon points="600,180 720,152 720,262 600,266" fill="#3b4250"/>
  <polygon points="610,188 670,175 670,220 610,228" fill="#14202e"/>
  <path d="M614 214 L626 206 L638 210 L650 196 L666 190" stroke="#7ff0c0" stroke-width="2" fill="none"/>
  <g>
    <circle cx="688" cy="180" r="5" fill="#ff5a5a"><animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="704" cy="176" r="5" fill="#ffd166"/>
    <circle cx="688" cy="198" r="5" fill="#5fe08a"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="704" cy="194" r="5" fill="#5fe08a"/>
    <rect x="682" y="214" width="28" height="6" rx="2" fill="#8f99a6"/>
    <rect x="682" y="228" width="28" height="6" rx="2" fill="#8f99a6"/>
    <rect x="614" y="238" width="50" height="8" rx="2" fill="#5a6372"/>
  </g>
  <polygon points="610,320 720,330 720,430 610,390" fill="#2b2f3a"/>
  <polygon points="616,326 714,335 714,422 616,385" fill="#d65fc2" opacity="0.35"/>
  <g stroke="#4caf50" stroke-width="3" stroke-linecap="round">
    <path d="M640 384 L640 360 M640 366 L632 356 M640 370 L648 360"/>
    <path d="M668 396 L668 368 M668 374 L658 364 M668 380 L678 370"/>
    <path d="M696 408 L696 380 M696 386 L686 376 M696 392 L706 382"/>
  </g>
  <polygon points="616,385 714,422 714,430 616,392" fill="#6b4a32"/>

  <!-- round window on the back wall -->
  <circle cx="400" cy="280" r="96" fill="#9aa5b2"/>
  <circle cx="400" cy="280" r="84" fill="#03081a"/>
  <g clip-path="url(#windowClip)">
    <g fill="#fff">
      <circle cx="350" cy="220" r="1.2"/><circle cx="420" cy="208" r="1"/><circle cx="460" cy="240" r="1.4"/>
      <circle cx="372" cy="250" r="0.9"/><circle cx="330" cy="270" r="1.2"/><circle cx="440" cy="222" r="0.8"/>
      <circle cx="398" cy="232" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <circle cx="430" cy="440" r="170" fill="url(#earth)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 430 440;-25 430 440" dur="60s" repeatCount="indefinite"/>
      <g fill="#5cb85c" opacity="0.85">
        <path d="M330 300 C360 290 380 300 390 320 C400 340 370 350 350 340 C330 330 320 316 330 300 Z"/>
        <path d="M440 290 C470 284 500 296 496 316 C490 336 460 330 450 344 C440 330 426 300 440 290 Z"/>
        <path d="M250 330 C270 320 300 330 296 350 C280 360 260 356 250 330 Z"/>
        <path d="M520 330 C540 326 560 340 552 356 C540 362 520 352 520 330 Z"/>
      </g>
      <g fill="#ffffff" opacity="0.85">
        <path d="M300 290 C330 280 360 286 380 282 C360 292 330 296 300 290 Z"/>
        <path d="M400 300 C430 296 460 306 480 300 C470 312 430 316 400 300 Z"/>
        <path d="M340 330 C370 326 400 334 420 330 C400 340 360 342 340 330 Z"/>
        <path d="M470 270 C490 268 520 274 530 270 C516 280 490 280 470 270 Z"/>
        <path d="M280 316 C300 312 320 316 330 314 C318 322 296 322 280 316 Z"/>
      </g>
    </g>
    <circle cx="430" cy="440" r="182" fill="url(#atmo)"/>
  </g>
  <circle cx="400" cy="280" r="84" fill="none" stroke="#5d6775" stroke-width="5"/>
  <path d="M340 230 A78 78 0 0 1 380 206" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>
  <g fill="#6f7a88">
    <circle cx="400" cy="190" r="4"/><circle cx="400" cy="370" r="4"/><circle cx="310" cy="280" r="4"/><circle cx="490" cy="280" r="4"/>
    <circle cx="336" cy="216" r="4"/><circle cx="464" cy="216" r="4"/><circle cx="336" cy="344" r="4"/><circle cx="464" cy="344" r="4"/>
  </g>
  <rect x="290" y="168" width="24" height="10" rx="2" fill="#f2c14e"/>
  <rect x="486" y="168" width="24" height="10" rx="2" fill="#f2c14e"/>

  <!-- tether anchor on the wall -->
  <circle cx="48" cy="521" r="9" fill="none" stroke="#5d6775" stroke-width="4"/>
  <rect x="38" y="526" width="20" height="10" rx="2" fill="#5d6775"/>

  <!-- floating: toy mouse -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;10 -8;0 0" dur="7s" repeatCount="indefinite"/>
    <g transform="translate(170 110)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/>
        <path d="M14 0 C20 10 34 18 40 8" stroke="#e88aa0" stroke-width="2" fill="none"/>
        <path d="M-22 0 C-22 -12 0 -16 14 0 C0 16 -22 12 -22 0 Z" fill="#a7aeb8"/>
        <circle cx="-8" cy="-11" r="6" fill="#a7aeb8"/>
        <circle cx="-8" cy="-11" r="3" fill="#f2a7b8"/>
        <circle cx="-20" cy="-2" r="2" fill="#2b2b2b"/>
        <circle cx="-25" cy="1" r="2.5" fill="#f2a7b8"/>
      </g>
    </g>
  </g>

  <!-- floating: fish cracker -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-8 10;0 0" dur="6s" repeatCount="indefinite"/>
    <g transform="translate(640 110)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="14s" repeatCount="indefinite"/>
        <path d="M-24 0 C-12 -16 12 -14 18 0 C12 14 -12 16 -24 0 Z" fill="#e2a052"/>
        <path d="M18 0 L32 -10 L30 0 L32 10 Z" fill="#e2a052"/>
        <circle cx="-12" cy="-3" r="2.5" fill="#6b3d1e"/>
        <path d="M-2 -8 Q4 0 -2 8 M6 -7 Q12 0 6 7" stroke="#b97a33" stroke-width="2" fill="none"/>
      </g>
    </g>
  </g>

  <!-- floating: food bowl spilling kibble -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;6 -10;0 0" dur="8s" repeatCount="indefinite"/>
    <g transform="translate(630 500) rotate(-30)">
      <path d="M-30 0 L30 0 L22 20 L-22 20 Z" fill="#3d6fd1"/>
      <ellipse cx="0" cy="0" rx="30" ry="7" fill="#2b54a8"/>
      <ellipse cx="0" cy="1" rx="24" ry="4" fill="#9a5f33"/>
    </g>
    <g fill="#9a5f33">
      <circle cx="612" cy="456" r="4"><animate attributeName="cy" values="470;440;470" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="598" cy="436" r="3.5"><animate attributeName="cx" values="606;590;606" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="630" cy="430" r="4"><animate attributeName="cy" values="446;420;446" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="414" r="3"/>
    </g>
  </g>

  <!-- floating: water droplets -->
  <g>
    <ellipse cx="520" cy="470" rx="11" ry="10" fill="url(#drop)">
      <animate attributeName="rx" values="11;9;12;11" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="10;12;9;10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="470;460;470" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="548" cy="440" rx="6" ry="6" fill="url(#drop)">
      <animate attributeName="rx" values="6;5;7;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="440;448;440" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="500" cy="500" r="4" fill="url(#drop)">
      <animate attributeName="cx" values="500;508;500" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating: yarn ball just out of reach -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;8 -6;0 0" dur="5s" repeatCount="indefinite"/>
    <path d="M488 236 C520 250 520 290 556 280 C590 270 580 230 612 240 C640 250 630 290 660 300" stroke="#e85d75" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M488 236 C520 250 520 290 556 280 C590 270 580 230 612 240 C640 250 630 290 660 300;M488 236 C516 260 530 280 560 270 C592 260 576 240 612 250 C644 260 628 280 664 290;M488 236 C520 250 520 290 556 280 C590 270 580 230 612 240 C640 250 630 290 660 300" dur="5s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(470 228)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
        <circle r="24" fill="#e85d75"/>
        <g stroke="#b8405a" stroke-width="2.2" fill="none">
          <path d="M-20 -12 C-6 -4 6 -4 20 -12"/>
          <path d="M-23 0 C-8 8 8 8 23 0"/>
          <path d="M-18 14 C-6 20 6 20 18 14"/>
          <path d="M-8 -22 C-16 -6 -16 6 -8 22"/>
          <path d="M8 -22 C16 -6 16 6 8 22"/>
        </g>
        <circle cx="-8" cy="-10" r="5" fill="#f59aaa" opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- CAT ASTRONAUT -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;6 -8;0 0" dur="6s" repeatCount="indefinite"/>
    <g transform="translate(270 340) rotate(-10)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="7s" repeatCount="indefinite"/>
        <!-- tether -->
        <path d="M-40 22 C-100 80 -160 60 -200 110 C-220 130 -238 132 -250 140" stroke="#e8b84a" stroke-width="3" fill="none"/>
        <!-- backpack -->
        <rect x="-64" y="-50" width="36" height="92" rx="10" fill="#b8c0ca" stroke="#8e98a4" stroke-width="2"/>
        <line x1="-56" y1="-50" x2="-56" y2="-66" stroke="#8e98a4" stroke-width="3"/>
        <circle cx="-56" cy="-68" r="4" fill="#ff5a5a">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <!-- tail in a suit sleeve -->
        <path d="M-34 40 C-80 64 -110 30 -130 50 C-148 68 -140 96 -120 96" stroke="#e9edf2" stroke-width="16" fill="none" stroke-linecap="round">
          <animate attributeName="d" values="M-34 40 C-80 64 -110 30 -130 50 C-148 68 -140 96 -120 96;M-34 40 C-80 70 -116 44 -136 60 C-154 76 -136 104 -114 98;M-34 40 C-80 64 -110 30 -130 50 C-148 68 -140 96 -120 96" dur="3s" repeatCount="indefinite"/>
        </path>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="3s" repeatCount="indefinite"/>
          <path d="M-126 96 C-122 104 -110 108 -104 100 C-108 92 -118 88 -126 96 Z" fill="#f2a34c"/>
        </g>
        <!-- legs -->
        <line x1="-18" y1="44" x2="-44" y2="94" stroke="#e9edf2" stroke-width="26" stroke-linecap="round"/>
        <line x1="18" y1="46" x2="34" y2="100" stroke="#dfe4ea" stroke-width="26" stroke-linecap="round"/>
        <ellipse cx="-48" cy="104" rx="19" ry="12" fill="#8e98a4" transform="rotate(30 -48 104)"/>
        <ellipse cx="38" cy="110" rx="19" ry="12" fill="#8e98a4" transform="rotate(-15 38 110)"/>
        <!-- back arm (waving) -->
        <line x1="-36" y1="-26" x2="-76" y2="-6" stroke="#dfe4ea" stroke-width="22" stroke-linecap="round"/>
        <circle cx="-82" cy="-4" r="13" fill="#c4ccd6"/>
        <!-- torso -->
        <ellipse cx="0" cy="0" rx="46" ry="58" fill="url(#suit)"/>
        <path d="M-44 18 Q0 34 44 18" stroke="#8e98a4" stroke-width="6" fill="none"/>
        <rect x="-18" y="-20" width="36" height="24" rx="4" fill="#4a5563"/>
        <circle cx="-9" cy="-8" r="3.5" fill="#ff5a5a"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
        <circle cx="1" cy="-8" r="3.5" fill="#5fe08a"/>
        <circle cx="10" cy="-8" r="3.5" fill="#ffd166"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
        <rect x="-12" y="-2" width="24" height="3" rx="1.5" fill="#8fd3ff"/>
        <!-- shoulder patch: paw print -->
        <circle cx="-24" cy="-32" r="10" fill="#3d6fd1"/>
        <g fill="#fff">
          <ellipse cx="-24" cy="-29" rx="4" ry="3.2"/>
          <circle cx="-29" cy="-34" r="1.6"/><circle cx="-24" cy="-36" r="1.6"/><circle cx="-19" cy="-34" r="1.6"/>
        </g>
        <!-- reaching arm -->
        <path d="M34 -24 C56 -36 72 -48 86 -58" stroke="#eef1f4" stroke-width="22" fill="none" stroke-linecap="round"/>
        <circle cx="92" cy="-62" r="13" fill="#c4ccd6"/>
        <g fill="#f2a7b8">
          <circle cx="98" cy="-68" r="2.4"/><circle cx="101" cy="-61" r="2.4"/><circle cx="96" cy="-74" r="2.2"/>
        </g>
        <!-- helmet collar -->
        <ellipse cx="0" cy="-44" rx="32" ry="10" fill="#9aa4b0"/>
        <!-- helmet back glass -->
        <circle cx="0" cy="-92" r="54" fill="#bfe6ff" opacity="0.25"/>
        <!-- cat head -->
        <polygon points="-34,-104 -27,-136 -8,-118" fill="#f2a34c"/>
        <polygon points="34,-104 27,-136 8,-118" fill="#f2a34c"/>
        <polygon points="-28,-110 -25,-128 -14,-117" fill="#f7b9c4"/>
        <polygon points="28,-110 25,-128 14,-117" fill="#f7b9c4"/>
        <ellipse cx="0" cy="-90" rx="38" ry="33" fill="#f2a34c"/>
        <g stroke="#d9822f" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M0 -122 L0 -110 M-9 -120 L-7 -110 M9 -120 L7 -110"/>
          <path d="M-38 -92 L-28 -90 M-37 -84 L-28 -84 M38 -92 L28 -90 M37 -84 L28 -84"/>
        </g>
        <ellipse cx="-9" cy="-77" rx="11" ry="8" fill="#fff4e6"/>
        <ellipse cx="9" cy="-77" rx="11" ry="8" fill="#fff4e6"/>
        <ellipse cx="0" cy="-70" rx="9" ry="6" fill="#fff4e6"/>
        <path d="M-4 -84 L4 -84 L0 -79 Z" fill="#f28da0"/>
        <path d="M-7 -75 Q-3 -71 0 -76 Q3 -71 7 -75" stroke="#7a4a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- eyes, looking at the yarn -->
        <g>
          <ellipse cx="-15" cy="-97" rx="8.5" ry="10" fill="#9bd36b">
            <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="15" cy="-97" rx="8.5" ry="10" fill="#9bd36b">
            <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="-12" cy="-98" rx="4" ry="8" fill="#1b1b1b">
            <animate attributeName="ry" values="8;8;0.8;8;8" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="18" cy="-98" rx="4" ry="8" fill="#1b1b1b">
            <animate attributeName="ry" values="8;8;0.8;8;8" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <circle cx="-10" cy="-102" r="2.2" fill="#fff"/>
          <circle cx="20" cy="-102" r="2.2" fill="#fff"/>
        </g>
        <ellipse cx="-24" cy="-80" rx="6" ry="3.5" fill="#f28da0" opacity="0.45"/>
        <ellipse cx="24" cy="-80" rx="6" ry="3.5" fill="#f28da0" opacity="0.45"/>
        <g stroke="#fff4e6" stroke-width="1.4" stroke-linecap="round">
          <line x1="-16" y1="-78" x2="-44" y2="-84"/><line x1="-16" y1="-75" x2="-44" y2="-74"/>
          <line x1="16" y1="-78" x2="44" y2="-84"/><line x1="16" y1="-75" x2="44" y2="-74"/>
        </g>
        <!-- helmet front -->
        <circle cx="0" cy="-92" r="54" fill="url(#glass)"/>
        <circle cx="0" cy="-92" r="54" fill="none" stroke="#e3e9f0" stroke-width="5"/>
        <path d="M-38 -118 A46 46 0 0 1 4 -140" stroke="#fff" stroke-width="6" fill="none" opacity="0.75" stroke-linecap="round"/>
        <circle cx="16" cy="-136" r="3" fill="#fff" opacity="0.75"/>
      </g>
    </g>
  </g>
</svg>
