<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Sky & Storm Gradients -->
    <linearGradient id="stormSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="30%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <radialGradient id="lightningGlow" cx="280" cy="120" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b101b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cloudGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Lighthouse Beacon Light Beams -->
    <linearGradient id="beaconBeam1" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#fde047" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beaconBeam2" x1="100%" y1="0%" x2="0%" y2="30%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lanternCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Rock & Cliff Gradients -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Sea & Wave Gradients -->
    <linearGradient id="deepSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e3a53"/>
      <stop offset="40%" stop-color="#082f49"/>
      <stop offset="80%" stop-color="#031d30"/>
      <stop offset="100%" stop-color="#010e17"/>
    </linearGradient>
    <linearGradient id="waveFoamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveTranslucent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="lightningFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tempestuous Sky -->
  <rect width="800" height="600" fill="url(#stormSky)"/>

  <!-- Lightning Glow Flash in Sky -->
  <circle cx="280" cy="120" r="350" fill="url(#lightningGlow)"/>

  <!-- Forked Jagged Lightning Bolts -->
  <g filter="url(#lightningFilter)">
    <!-- Main Bolt striking behind clouds toward horizon -->
    <path d="M 310 0 L 295 45 L 320 70 L 285 115 L 305 130 L 270 185 L 290 195 L 260 250 L 275 260 L 255 310" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 310 0 L 295 45 L 320 70 L 285 115 L 305 130 L 270 185 L 290 195 L 260 250 L 275 260 L 255 310" 
          fill="none" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Fork branches -->
    <path d="M 295 45 L 265 65 L 255 90 L 235 105" fill="none" stroke="#e0e7ff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 285 115 L 315 135 L 325 160 L 345 175" fill="none" stroke="#e0e7ff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 270 185 L 245 205 L 235 230" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Rolling Storm Clouds (Multiple dramatic turbulent layers) -->
  <g id="cloudsBack">
    <path d="M -50 140 C 20 80 120 70 180 120 C 230 60 340 50 410 100 C 470 50 590 60 640 110 C 700 80 780 100 850 150 L 850 0 L -50 0 Z" fill="url(#cloudGrad1)"/>
    <path d="M -20 220 C 60 160 180 170 240 210 C 310 150 440 140 520 190 C 580 150 710 160 770 220 C 820 190 860 210 880 240 L 880 0 L -20 0 Z" fill="url(#cloudGrad2)" opacity="0.75"/>
  </g>

  <!-- Distant rain squalls on horizon -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.18">
    <line x1="50" y1="200" x2="30" y2="380"/>
    <line x1="90" y1="180" x2="70" y2="390"/>
    <line x1="140" y1="190" x2="115" y2="380"/>
    <line x1="200" y1="170" x2="175" y2="390"/>
    <line x1="260" y1="180" x2="235" y2="380"/>
    <line x1="320" y1="190" x2="295" y2="380"/>
    <line x1="380" y1="180" x2="355" y2="380"/>
    <line x1="440" y1="190" x2="415" y2="380"/>
  </g>

  <!-- JAGGED SEA CLIFF & PROMONTORY -->
  <g id="seaCliff">
    <!-- Base cliff mass rising dramatically from the stormy waters on the right -->
    <path d="M 480 340 L 515 280 L 540 250 L 610 245 L 670 255 L 750 290 L 820 330 L 820 550 L 580 500 L 510 440 L 480 370 Z" fill="url(#cliffGrad)"/>

    <!-- Sharp rock facets & crags -->
    <polygon points="540,250 565,310 525,325 515,280" fill="#334155"/>
    <polygon points="565,310 610,245 625,315 580,340" fill="#1e293b"/>
    <polygon points="610,245 670,255 680,320 625,315" fill="#475569" opacity="0.6"/>
    <polygon points="670,255 750,290 735,350 680,320" fill="#1e293b"/>
    <polygon points="525,325 580,340 550,400 500,380" fill="#0f172a"/>
    <polygon points="580,340 645,335 630,420 550,400" fill="#1e293b"/>
    <polygon points="645,335 735,350 710,430 630,420" fill="#0f172a"/>
    <polygon points="550,400 630,420 600,480 520,450" fill="#090d16"/>

    <!-- Jagged lower reef rocks braving the waves -->
    <polygon points="450,420 485,360 510,430 470,450" fill="#0f172a"/>
    <polygon points="410,460 445,410 465,470 425,485" fill="#090d16"/>
  </g>

  <!-- THE ICONIC LIGHTHOUSE TOWER -->
  <g id="lighthouseTower" transform="translate(600, 70)">
    <!-- Tower Foundation Platform -->
    <polygon points="-38,180 38,180 44,195 -44,195" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="-42" y="193" width="84" height="6" fill="#090d16"/>

    <!-- Conical Tapering Lighthouse Body -->
    <!-- Clip path for the tower shaft -->
    <clipPath id="towerClip">
      <polygon points="-24,40 24,40 36,180 -36,180"/>
    </clipPath>

    <!-- Base tower structure -->
    <polygon points="-24,40 24,40 36,180 -36,180" fill="#e2e8f0"/>

    <!-- Iconic Bold Red & White Bands -->
    <g clip-path="url(#towerClip)">
      <!-- Band 1 (Top red) -->
      <polygon points="-40,40 40,40 40,65 -40,65" fill="#dc2626"/>
      <!-- Band 2 (White) -> background -->
      <!-- Band 3 (Red) -->
      <polygon points="-40,95 40,95 40,125 -40,125" fill="#dc2626"/>
      <!-- Band 4 (White) -> background -->
      <!-- Band 5 (Bottom red) -->
      <polygon points="-40,155 40,155 40,185 -40,185" fill="#dc2626"/>

      <!-- Tower Shading (Dramatic left shadow from storm, right highlight from light reflection) -->
      <polygon points="-40,40 -8,40 -12,185 -40,185" fill="#0f172a" opacity="0.45"/>
      <polygon points="12,40 40,40 40,185 18,185" fill="#ffffff" opacity="0.15"/>

      <!-- Slender arched windows with warm glowing light inside -->
      <path d="M -4 75 A 3 3 0 0 1 2 75 L 2 85 L -4 85 Z" fill="#fef08a" stroke="#451a03" stroke-width="1"/>
      <path d="M -5 135 A 3 3 0 0 1 3 135 L 3 146 L -5 146 Z" fill="#fef08a" stroke="#451a03" stroke-width="1"/>
      <!-- Cozy warm light spill from tower windows -->
      <circle cx="-1" cy="80" r="8" fill="#fef08a" opacity="0.3"/>
      <circle cx="-1" cy="140" r="8" fill="#fef08a" opacity="0.3"/>
    </g>

    <!-- Tower Cornice & Gallery Balcony -->
    <polygon points="-28,40 28,40 32,32 -32,32" fill="#334155"/>
    <rect x="-30" y="30" width="60" height="3" fill="#1e293b"/>
    <!-- Balcony Railing -->
    <line x1="-28" y1="24" x2="28" y2="24" stroke="#0f172a" stroke-width="2"/>
    <g stroke="#0f172a" stroke-width="1.2">
      <line x1="-26" y1="24" x2="-26" y2="30"/>
      <line x1="-18" y1="24" x2="-18" y2="30"/>
      <line x1="-10" y1="24" x2="-10" y2="30"/>
      <line x1="-2" y1="24" x2="-2" y2="30"/>
      <line x1="6" y1="24" x2="6" y2="30"/>
      <line x1="14" y1="24" x2="14" y2="30"/>
      <line x1="22" y1="24" x2="22" y2="30"/>
    </g>

    <!-- Glass Lantern Room -->
    <rect x="-20" y="4" width="40" height="26" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Diagonal astragals / panes -->
    <line x1="-20" y1="4" x2="0" y2="30" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="4" x2="20" y2="30" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="4" x2="-20" y2="30" stroke="#475569" stroke-width="1.5"/>
    <line x1="20" y1="4" x2="0" y2="30" stroke="#475569" stroke-width="1.5"/>

    <!-- Lantern Room Dome & Lightning Rod Spire -->
    <path d="M -22 4 C -22 -12 22 -12 22 4 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="0" cy="-12" rx="4" ry="2" fill="#d97706"/>
    <line x1="0" y1="-12" x2="0" y2="-28" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="0" cy="-28" r="2" fill="#fef08a"/>

    <!-- BLINDING LANTERN BULB CORE & FRESNEL LENS -->
    <circle cx="0" cy="17" r="16" fill="url(#lanternCore)"/>
    <circle cx="0" cy="17" r="8" fill="#ffffff"/>
  </g>

  <!-- POWERFUL BEACON LIGHT CONES SWEEPING THROUGH THE STORM -->
  <!-- Main Left Beam piercing into the sea & mist -->
  <!-- Lighthouse lantern is at (600, 87) -->
  <polygon points="600,87 -50,160 -50,420" fill="url(#beaconBeam1)" style="mix-blend-mode: screen;"/>
  <!-- Secondary Right Beam sweeping aft -->
  <polygon points="600,87 850,20 850,150" fill="url(#beaconBeam2)" style="mix-blend-mode: screen;"/>

  <!-- Dramatic illumination aura around the lantern -->
  <circle cx="600" cy="87" r="90" fill="url(#lanternCore)" opacity="0.6"/>

  <!-- THE SEETHING, POWERFUL OCEAN SEEN FROM SEA LEVEL -->
  <!-- Distant Wave Swells (Dark deep water) -->
  <path d="M 0 380 Q 90 350 190 385 T 400 370 T 600 395 T 800 375 L 800 600 L 0 600 Z" fill="#031d30"/>

  <!-- Midground Rolling Breakers & Cresting Swell -->
  <path d="M 0 420 Q 120 380 230 425 T 460 410 T 680 435 T 800 415 L 800 600 L 0 600 Z" fill="url(#deepSea)"/>

  <!-- Crashing Breaker & Dramatic Spray hitting the Lighthouse Cliff -->
  <!-- Giant wave exploding on the cliff base (approx x: 440-520, y: 360-440) -->
  <g id="cliffSplash">
    <!-- Huge white spray plume -->
    <path d="M 460 450 C 440 380 420 320 460 270 C 475 250 500 270 490 310 C 510 280 540 290 530 330 C 550 310 570 330 550 370 C 570 360 580 390 560 420 C 540 440 500 450 460 450 Z" 
          fill="url(#waveFoamGrad)" opacity="0.85"/>
    <path d="M 450 430 C 435 370 430 310 470 290 C 485 320 515 310 520 350 C 535 340 545 365 530 410 Z" 
          fill="#ffffff" opacity="0.9"/>
    <!-- Airborne spray mist dots illuminated by beacon light -->
    <g fill="#fef08a" opacity="0.8">
      <circle cx="440" cy="275" r="2.5"/><circle cx="455" cy="255" r="3"/><circle cx="470" cy="240" r="2"/>
      <circle cx="490" cy="250" r="3.5"/><circle cx="510" cy="265" r="2.5"/><circle cx="525" cy="280" r="2"/>
      <circle cx="435" cy="300" r="3"/><circle cx="445" cy="320" r="2"/><circle cx="425" cy="340" r="3.5"/>
    </g>
    <g fill="#ffffff" opacity="0.7">
      <circle cx="420" cy="290" r="2"/><circle cx="450" cy="235" r="2"/><circle cx="480" cy="230" r="2.5"/>
      <circle cx="535" cy="260" r="2"/><circle cx="550" cy="300" r="2.5"/><circle cx="410" cy="360" r="3"/>
    </g>
  </g>

  <!-- FOREGROUND MONUMENTAL SWELL & CRESTING WAVE (POV: From a pitching ship at sea) -->
  <!-- Wave body rising up into towering crest -->
  <path d="M -20 540 Q 140 430 320 450 Q 420 460 540 420 Q 660 380 820 470 L 820 600 L -20 600 Z" fill="#042235"/>

  <!-- Translucent Emerald curl under the crest -->
  <path d="M 60 490 Q 180 435 310 455 Q 390 465 480 440 Q 560 415 650 410 Q 560 440 460 470 Q 340 495 180 480 L 60 490 Z" fill="url(#waveTranslucent)"/>

  <!-- Crashing White Froth & Foam Lip curling over the wave crest -->
  <path d="M 80 480 C 130 460 170 455 220 450 C 270 445 320 460 370 455 C 420 450 480 430 530 420 C 580 410 630 395 680 405 C 650 425 610 425 560 435 C 510 445 450 470 390 475 C 330 480 270 470 210 475 C 160 480 120 495 80 480 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Sea Foam Trails & Webbed Filigree rushing down the face of the wave -->
  <g stroke="#bae6fd" stroke-width="1.8" fill="none" opacity="0.75" stroke-linecap="round">
    <!-- Webbing 1 -->
    <path d="M 160 465 Q 180 490 200 520 Q 210 545 220 580"/>
    <path d="M 180 485 Q 210 495 240 515"/>
    <path d="M 195 510 Q 230 525 250 560"/>

    <!-- Webbing 2 (Center) -->
    <path d="M 330 465 Q 350 495 365 535 Q 375 565 385 600"/>
    <path d="M 350 485 Q 385 505 410 530"/>
    <path d="M 365 520 Q 400 540 425 580"/>

    <!-- Webbing 3 (Right) -->
    <path d="M 520 430 Q 545 465 570 510 Q 590 550 610 595"/>
    <path d="M 545 455 Q 580 475 615 505"/>
    <path d="M 570 490 Q 610 520 635 565"/>
  </g>

  <!-- Immediate Foreground Swell (Bottom right & bottom left chop) -->
  <path d="M -10 570 Q 150 520 310 550 Q 470 580 620 530 Q 730 495 810 540 L 810 600 L -10 600 Z" fill="#01131f"/>
  <path d="M 220 555 Q 260 540 300 550 Q 340 560 380 555" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.6"/>
  <path d="M 560 535 Q 610 520 660 530 Q 700 540 740 535" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.6"/>

  <!-- DRIVING RAIN SLANTED BY GALE-FORCE WINDS (Across entire frame) -->
  <g stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round" opacity="0.38">
    <!-- Row 1 -->
    <line x1="80" y1="40" x2="20" y2="130"/><line x1="160" y1="20" x2="100" y2="110"/><line x1="240" y1="30" x2="180" y2="120"/>
    <line x1="320" y1="10" x2="260" y2="100"/><line x1="400" y1="30" x2="340" y2="120"/><line x1="480" y1="20" x2="420" y2="110"/>
    <line x1="560" y1="40" x2="500" y2="130"/><line x1="640" y1="10" x2="580" y2="100"/><line x1="720" y1="30" x2="660" y2="120"/>
    <!-- Row 2 -->
    <line x1="60" y1="160" x2="0" y2="250"/><line x1="140" y1="140" x2="80" y2="230"/><line x1="220" y1="150" x2="160" y2="240"/>
    <line x1="300" y1="130" x2="240" y2="220"/><line x1="380" y1="150" x2="320" y2="240"/><line x1="460" y1="140" x2="400" y2="230"/>
    <line x1="540" y1="160" x2="480" y2="250"/><line x1="620" y1="130" x2="560" y2="220"/><line x1="700" y1="150" x2="640" y2="240"/>
    <line x1="780" y1="140" x2="720" y2="230"/>
    <!-- Row 3 -->
    <line x1="90" y1="280" x2="30" y2="370"/><line x1="170" y1="260" x2="110" y2="350"/><line x1="250" y1="270" x2="190" y2="360"/>
    <line x1="330" y1="250" x2="270" y2="340"/><line x1="410" y1="270" x2="350" y2="360"/><line x1="490" y1="260" x2="430" y2="350"/>
    <line x1="570" y1="280" x2="510" y2="370"/><line x1="650" y1="250" x2="590" y2="340"/><line x1="730" y1="270" x2="670" y2="360"/>
    <!-- Row 4 (Lower water level) -->
    <line x1="70" y1="400" x2="10" y2="490"/><line x1="150" y1="380" x2="90" y2="470"/><line x1="230" y1="390" x2="170" y2="480"/>
    <line x1="310" y1="370" x2="250" y2="460"/><line x1="390" y1="390" x2="330" y2="480"/><line x1="470" y1="380" x2="410" y2="470"/>
    <line x1="550" y1="400" x2="490" y2="490"/><line x1="630" y1="370" x2="570" y2="460"/><line x1="710" y1="390" x2="650" y2="480"/>
  </g>

  <!-- Golden glistening raindrops catching the lighthouse beam -->
  <g stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <line x1="250" y1="180" x2="200" y2="255"/>
    <line x1="340" y1="150" x2="290" y2="225"/>
    <line x1="420" y1="130" x2="370" y2="205"/>
    <line x1="490" y1="110" x2="440" y2="185"/>
    <line x1="180" y1="220" x2="130" y2="295"/>
    <line x1="280" y1="210" x2="230" y2="285"/>
    <line x1="370" y1="190" x2="320" y2="265"/>
  </g>

  <!-- Subtle vignette edges -->
  <rect width="800" height="600" fill="none" stroke="#000000" stroke-width="4" opacity="0.4"/>
</svg>
