      <rect width="40" height="40" fill="#3a4250"/>
      <rect x="40" y="40" width="40" height="40" fill="#3a4250"/>
    </pattern>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcdf0"/>
      <stop offset="0.55" stop-color="#ffd3a6"/>
      <stop offset="1" stop-color="#ffab8a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fa9b5"/>
      <stop offset="0.35" stop-color="#9fdbe0"/>
      <stop offset="1" stop-color="#4c93a0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb6bf"/>
      <stop offset="0.3" stop-color="#f2f5f7"/>
      <stop offset="0.6" stop-color="#c8cfd6"/>
      <stop offset="1" stop-color="#8d96a0"/>
    </linearGradient>
    <radialGradient id="eyeGlow">
      <stop offset="0" stop-color="#bffcff"/>
      <stop offset="1" stop-color="#3fd9ee"/>
    </radialGradient>
    <radialGradient id="flame" cx="0.5" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#7fd2ff"/>
      <stop offset="1" stop-color="#2a6bff"/>
    </radialGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
  </defs>

