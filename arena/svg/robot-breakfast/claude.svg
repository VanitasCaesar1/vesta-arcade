<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <pattern id="tiles" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#cfe7e4"/>
      <rect x="1" y="1" width="30" height="30" rx="3" fill="#e6f4f2"/>
    </pattern>
    <pattern id="checker" width="80" height="80" patternUnits="userSpaceOnUse">
