<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6c8"/>
      <stop offset="1" stop-color="#e8cfa6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d969e"/>
      <stop offset="0.35" stop-color="#f4f7f9"/>
      <stop offset="0.6" stop-color="#c3cad0"/>
      <stop offset="1" stop-color="#7b848c"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c4f25"/>
      <stop offset="0.4" stop-color="#f0a46a"/>
      <stop offset="1" stop-color="#a95a2c"/>
    </linearGradient>
    <radialGradient id="scales" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#4fc2a3"/>
      <stop offset="1" stop-color="#2b8a73"/>
    </radialGradient>
    <pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#efe8dc"/>
      <rect width="20" height="20" fill="#3b3433"/>
      <rect x="20" y="20" width="20" height="20" fill="#3b3433"/>
    </pattern>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#875335"/>
      <stop offset="1" stop-color="#5f3820"/>
    </linearGradient>
  </defs>

  <!-- room -->
  <rect width="800" height="520" fill="url(#wall)"/>
  <rect y="500" width="800" height="100" fill="url(#tiles)"/>
  <rect y="500" width="800" height="100" fill="#000" opacity="0.12"/>
  <rect width="800" height="24" fill="#5b3a26"/>
  <rect y="24" width="800" height="4" fill="#3e2617"/>

  <!-- string lights -->
  <path d="M0 30 Q200 72 400 30 Q600 72 800 30" stroke="#3e2617" stroke-width="2" fill="none"/>
  <g>
    <circle cx="60" cy="43" r="5" fill="#ffd36e"><animate attributeName="opacity" values="1;0.5;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="49" r="5" fill="#ff9e6e"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="51" r="5" fill="#ffd36e"><animate attributeName="opacity" values="1;0.6;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="49" r="5" fill="#9ee3c8"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="43" r="5" fill="#ffd36e"><animate attributeName="opacity" values="1;0.5;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="43" r="5" fill="#ff9e6e"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="49" r="5" fill="#ffd36e"><animate attributeName="opacity" values="1;0.6;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="51" r="5" fill="#9ee3c8"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="49" r="5" fill="#ffd36e"><animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="43" r="5" fill="#ff9e6e"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- chalkboard with doodles -->
  <rect x="34" y="70" width="164" height="142" rx="4" fill="#7a4d2f"/>
  <rect x="42" y="78" width="148" height="126" fill="#2f3d38"/>
  <g stroke="#f3efe3" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M62 120 L62 140 Q62 152 75 152 L89 152 Q102 152 102 140 L102 120 Z"/>
    <path d="M102 126 q12 0 12 9 q0 9 -12 9"/>
    <path d="M72 112 q-5 -8 0 -15 M84 112 q-5 -8 0 -15 M96 112 q-5 -8 0 -15"/>
    <path d="M128 102 q20 4 46 -2 M128 122 q18 3 38 0 M128 142 q20 4 44 -1 M128 162 q14 2 30 0"/>
    <path d="M70 178 c-6 -8 4 -14 8 -6 c4 -8 14 -2 8 6 l-8 8 Z" stroke="#f29b9b"/>
    <path d="M150 190 c-10 -10 0 -22 4 -26 c0 8 10 10 6 18 c6 -2 6 -8 6 -8 c6 10 -2 18 -10 18 Z" stroke="#f2c06b"/>
  </g>

