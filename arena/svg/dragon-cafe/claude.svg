    </path>
    <path d="M626 346 q-6 -8 0 -16 q6 -8 0 -16" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M184 358 q-4 -6 0 -12 q4 -6 0 -12" stroke-width="2" opacity="0">
