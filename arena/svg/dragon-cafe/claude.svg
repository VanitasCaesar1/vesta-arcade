  <g stroke="#4c2c18" stroke-width="2" opacity="0.6">
    <line x1="160" y1="392" x2="160" y2="575"/><line x1="220" y1="392" x2="220" y2="575"/>
    <line x1="280" y1="392" x2="280" y2="575"/><line x1="340" y1="392" x2="340" y2="575"/>
    <line x1="400" y1="392" x2="400" y2="575"/><line x1="460" y1="392" x2="460" y2="575"/>
    <line x1="520" y1="392" x2="520" y2="575"/><line x1="580" y1="392" x2="580" y2="575"/>
    <line x1="640" y1="392" x2="640" y2="575"/>
  </g>
  <rect x="90" y="376" width="620" height="16" rx="3" fill="#4f2e1b"/>
  <rect x="90" y="376" width="620" height="4" rx="2" fill="#a2704c"/>
  <rect x="100" y="560" width="600" height="15" fill="#3e2415"/>

  <!-- pour-over cup on counter -->
  <path d="M212 348 L256 348 L252 376 L216 376 Z" fill="#fbf8f2"/>
  <path d="M256 354 q10 0 10 8 q0 8 -10 8" stroke="#fbf8f2" stroke-width="4" fill="none"/>
  <path d="M202 330 L264 330 L248 352 L218 352 Z" fill="#e07a5f"/>
  <path d="M206 330 L260 330" stroke="#f4e9d8" stroke-width="3"/>

