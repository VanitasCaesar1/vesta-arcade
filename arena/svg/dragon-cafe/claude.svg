  <circle cx="250" cy="100" r="60" fill="url(#glow)" opacity="0.7"/>
  <path d="M226 86 L274 86 L262 62 L238 62 Z" fill="#2f6f62"/>
  <ellipse cx="250" cy="88" rx="9" ry="5" fill="#fff6cf"/>

  <!-- shelves -->
  <g>
    <rect x="652" y="128" width="140" height="7" fill="#6b4329"/>
    <rect x="652" y="194" width="140" height="7" fill="#6b4329"/>
    <rect x="664" y="104" width="20" height="24" rx="4" fill="#e76f51"/>
    <rect x="690" y="108" width="20" height="20" rx="4" fill="#f4f1de"/>
    <rect x="716" y="104" width="20" height="24" rx="4" fill="#2a9d8f"/>
    <rect x="742" y="98" width="26" height="30" rx="6" fill="#d9e8ef" opacity="0.85"/>
    <rect x="745" y="110" width="20" height="16" rx="3" fill="#5a3218"/>
    <rect x="744" y="94" width="22" height="6" rx="2" fill="#8a5a3a"/>
    <rect x="662" y="166" width="26" height="28" rx="6" fill="#d9e8ef" opacity="0.85"/>
    <rect x="665" y="176" width="20" height="16" rx="3" fill="#6b3d1e"/>
    <rect x="664" y="162" width="22" height="6" rx="2" fill="#8a5a3a"/>
    <rect x="698" y="172" width="20" height="22" rx="4" fill="#f4a261"/>
    <rect x="724" y="170" width="20" height="24" rx="4" fill="#f4f1de"/>
    <path d="M754 194 L756 168 L780 168 L782 194 Z" fill="#c9d8a8"/>
    <path d="M768 168 C760 150 752 150 748 140 M768 168 C776 150 786 152 790 140" stroke="#4f8f4a" stroke-width="3" fill="none"/>
    <ellipse cx="750" cy="142" rx="7" ry="4" fill="#5fa65a"/>
    <ellipse cx="789" cy="141" rx="7" ry="4" fill="#5fa65a"/>
  </g>

  <!-- DRAGON (behind the counter) -->
  <g>
    <!-- wing -->
    <path d="M520 238 C540 192 562 160 604 138 C600 162 592 174 598 188 C582 186 572 196 576 212 C560 208 548 222 548 244 Z" fill="#7b68b5"/>
    <path d="M522 236 L604 138 M598 188 L560 214 M576 212 L548 240" stroke="#584a90" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- torso -->
    <ellipse cx="470" cy="320" rx="96" ry="114" fill="url(#scales)"/>
    <ellipse cx="450" cy="332" rx="56" ry="86" fill="#f3dc9c"/>
    <g stroke="#d9bd73" stroke-width="2" fill="none">
      <path d="M402 262 Q450 272 498 262"/>
      <path d="M396 290 Q450 300 504 290"/>
    </g>
    <!-- neck -->
    <ellipse cx="448" cy="208" rx="38" ry="54" fill="#36a085" transform="rotate(-25 448 208)"/>
    <path d="M425 178 Q440 205 438 250" stroke="#f3dc9c" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- back spikes -->
    <g fill="#f2b544">
