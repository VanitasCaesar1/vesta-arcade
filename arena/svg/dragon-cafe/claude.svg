  <path d="M458 374 L462 350 L498 350 L502 374 Z" fill="#f2a7b5"/>
  <path d="M460 352 Q480 340 500 352" fill="#fff3f5"/>
  <circle cx="480" cy="340" r="5" fill="#d64545"/>
  <path d="M444 374 C444 330 516 330 516 374 Z" fill="#d7eef5" opacity="0.35" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M456 360 Q458 342 472 336" stroke="#fff" stroke-width="3" fill="none" opacity="0.8"/>
  <circle cx="480" cy="328" r="4" fill="#cfd8dc"/>

  <!-- sparrow customer -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 0" keyTimes="0;0.1;0.2;1" dur="3s" repeatCount="indefinite"/>
    <path d="M118 352 L98 344 L104 360 Z" fill="#7a5235"/>
    <ellipse cx="136" cy="358" rx="22" ry="16" fill="#a0704a"/>
    <ellipse cx="142" cy="364" rx="13" ry="10" fill="#f1e2c6"/>
    <path d="M122 352 Q134 346 144 356" stroke="#7a5235" stroke-width="3" fill="none"/>
