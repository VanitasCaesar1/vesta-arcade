  <path d="M588 216 l-5 -6 M592 210 l-3 -8 M600 208 l0 -8" stroke="#f5e6c4" stroke-width="4" stroke-linecap="round"/>

  <!-- gooseneck kettle in left claw -->
  <path d="M296 286 C276 290 268 276 262 266 C256 256 246 258 240 268" stroke="#b9682f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M290 296 L360 296 C362 270 350 250 325 248 C300 250 288 270 290 296 Z" fill="url(#copper)"/>
  <rect x="288" y="292" width="74" height="7" rx="3" fill="#7d3f1c"/>
  <circle cx="325" cy="244" r="5" fill="#3a2a22"/>
  <path d="M352 256 C376 252 378 290 358 292" stroke="#3a2a22" stroke-width="6" fill="none"/>
  <path d="M303 266 Q308 256 318 254" stroke="#ffd7b0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
