    <path d="M446 309 Q452 305 458 303" stroke="#8a5537" stroke-width="2" fill="none"/>
    <!-- horns -->
    <path d="M432 110 Q452 70 512 60 Q480 84 460 118 Z" fill="#f5e6c4"/>
    <path d="M454 122 Q484 96 540 96 Q504 110 476 134 Z" fill="#e9d6a9"/>
