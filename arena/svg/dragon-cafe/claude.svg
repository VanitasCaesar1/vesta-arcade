  <path d="M14 584 C6 540 18 500 36 486 L30 472 L76 472 L70 486 C90 500 100 540 92 584 Z" fill="#b8925f"/>
  <path d="M30 486 L76 486" stroke="#7d5f39" stroke-width="5"/>
  <path d="M36 520 Q53 528 70 520 M30 548 Q53 556 80 548" stroke="#9c7a4c" stroke-width="2" fill="none"/>
  <ellipse cx="53" cy="476" rx="20" ry="5" fill="#5a3218"/>
  <g fill="#5a3218">
    <ellipse cx="34" cy="470" rx="5" ry="3.5"/><ellipse cx="50" cy="466" rx="5" ry="3.5"/><ellipse cx="66" cy="469" rx="5" ry="3.5"/>
