    <rect x="592" y="238" width="68" height="106" rx="8" fill="#c0392b"/>
    <rect x="598" y="238" width="10" height="106" fill="#e35d4d" opacity="0.6"/>
    <ellipse cx="626" cy="238" rx="38" ry="14" fill="url(#chrome)"/>
    <path d="M598 236 Q626 196 654 236 Z" fill="url(#chrome)"/>
    <circle cx="626" cy="203" r="7" fill="#d4a23a"/>
    <circle cx="648" cy="278" r="12" fill="#f5f2ea" stroke="#7b848c" stroke-width="3"/>
    <line x1="648" y1="278" x2="654" y2="271" stroke="#333" stroke-width="2"/>
    <rect x="606" y="316" width="40" height="12" rx="3" fill="url(#chrome)"/>
    <rect x="574" y="320" width="34" height="7" rx="3" fill="#2a2a2a"/>
    <!-- lever -->
    <line x1="618" y1="316" x2="602" y2="228" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>
    <!-- espresso pour -->
    <line x1="626" y1="330" x2="626" y2="356" stroke="#5a2f15" stroke-width="3" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <path d="M612 354 L640 354 L637 374 L615 374 Z" fill="#fbf8f2"/>
    <ellipse cx="626" cy="376" rx="20" ry="4" fill="#e9e3d6"/>
  </g>
