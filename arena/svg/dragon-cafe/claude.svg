    <animate attributeName="stroke-dashoffset" values="11;0" dur="0.35s" repeatCount="indefinite"/>
  </path>
  <!-- left arm + claw -->
  <path d="M430 262 C410 280 392 282 372 274" stroke="#36a085" stroke-width="26" fill="none" stroke-linecap="round"/>
