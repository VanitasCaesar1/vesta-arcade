      <circle cx="350" cy="160" r="3"/><circle cx="362" cy="152" r="2.5"/>
    </g>
    <!-- eye -->
    <path d="M388 122 Q405 112 422 122" stroke="#1d4d42" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="405" cy="142" rx="13" ry="15" fill="#fff"/>
    <circle cx="400" cy="145" r="8" fill="#1d2a2a"/>
    <circle cx="397" cy="141" r="2.8" fill="#fff"/>
    <ellipse cx="405" cy="142" rx="14.5" ry="0" fill="#36a085">
      <animate attributeName="ry" values="0;0;16;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="385" cy="176" rx="11" ry="6" fill="#f08a8a" opacity="0.45"/>
    <ellipse cx="320" cy="176" rx="4.5" ry="3" fill="#1d4d42" transform="rotate(-20 320 176)"/>
    <path d="M318 198 Q346 207 384 190" stroke="#1d4d42" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M338 202 L342 210 L346 202 Z" fill="#fff"/>
    <!-- happy little nostril flame -->
    <g transform="translate(312 176)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.7;1.15;0.85;1.05;0.7" dur="0.9s" repeatCount="indefinite"/>
        <path d="M0 0 C-10 -12 -26 -10 -38 -4 C-28 -3 -27 2 -34 9 C-20 10 -8 7 0 0 Z" fill="#f2793b"/>
        <path d="M-2 0 C-8 -6 -18 -6 -25 -2 C-19 -1 -18 2 -22 6 C-14 6 -6 4 -2 0 Z" fill="#ffd166"/>
      </g>
    </g>
    <!-- right arm on the lever -->
    <line x1="540" y1="266" x2="598" y2="222" stroke="#2f927a" stroke-width="25" stroke-linecap="round"/>
